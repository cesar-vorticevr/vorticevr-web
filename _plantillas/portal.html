<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Generado con tools/generar-cliente.mjs desde _clientes/{{slug}}/cliente.json. No editar a mano: editar el JSON y regenerar. -->
<style>[hidden]{display:none!important}img{max-width:100%}html,body{margin:0}</style>
<title>{{nombre}}</title>
{{{fuente_link}}}
<style>
/* Layout: the client's printed card, extended to a phone screen. Light ground, optional printed strip top and bottom, logo mark, accent color, optional textured band and footer logos. */
:root{
  --bg:{{colores.fondo}}; --fg:{{colores.texto}}; --muted:{{colores.suave}}; --wine:{{colores.acento}}; --wine-deep:{{colores.acento_oscuro}}; --line:{{colores.linea}}; --white:#ffffff;
  --font:{{{fuente_css}}};
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;padding-inline:0;padding-block:0}
.wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.strip{height:22px;background:url("{{imagenes.franja}}") repeat-x center/auto 100%;flex:none}
.inner{padding-inline:20px;padding-block:22px;display:flex;flex-direction:column;gap:22px;flex:1}
header{position:relative;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
header.nologo{grid-template-columns:1fr}
header img{width:96px;height:auto;max-width:100%}
.id h1{margin:0;font-size:1.35rem;font-weight:800;line-height:1.15;text-wrap:balance;color:var(--fg)}
.id .role{margin:4px 0 0;font-weight:800;color:var(--wine);font-size:1rem}
.id .org{margin:6px 0 0;font-weight:600;font-size:.84rem;line-height:1.35;color:var(--muted)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding-block:13px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;min-width:0}
.row:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.row .ico{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--wine)}
.row .ico svg{width:22px;height:22px;fill:currentColor}
.row .txt{display:flex;flex-direction:column;flex:1;min-width:0}
.row .lbl{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row .val{font-weight:600;font-size:.95rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row .val.small{font-size:.82rem;line-height:1.35}
.copy{flex:none;font:inherit;font-size:.72rem;font-weight:800;letter-spacing:.04em;background:transparent;border:1.5px solid var(--wine);color:var(--wine);border-radius:999px;padding:6px 11px;cursor:pointer}
.copy:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.cta{display:flex;gap:10px}
.cta a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:12px;font-weight:800;font-size:.9rem;text-decoration:none;color:var(--white);background:var(--wine);min-width:0;text-align:center}
.cta a.alt{background:var(--white);color:var(--wine);border:1.5px solid var(--wine)}
.cta a:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.cta svg{width:20px;height:20px;fill:currentColor;flex:none}
.ra{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--white);background:var(--wine-deep) {{{textura_css_ra}}};min-width:0}
.ra:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.ra-ico{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.ra-ico svg{width:24px;height:24px;fill:currentColor}
.ra-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.ra-k{font-weight:800;font-size:1rem}
.ra-v{font-size:.8rem;opacity:.85;font-weight:600}
.ra-go{font-size:1.3rem;font-weight:800}
.band{position:relative;margin-inline:-20px;background:var(--wine-deep) {{{textura_css_banda}}};padding:20px 20px 22px;color:var(--white);display:flex;flex-direction:column;gap:6px}
.band .k{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
.band p{margin:0;font-weight:600;font-size:.95rem;line-height:1.5}
.band a{color:var(--white);font-weight:800}
footer{margin-top:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
footer img{width:100%;max-width:380px;height:auto}
footer small{font-size:.68rem;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.03em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:360px){header{grid-template-columns:76px 1fr}header img{width:76px}}
</style>
</head>
<body>

<div class="wrap">
  {{{franja}}}
  <div class="inner">
    {{{cabecera}}}

    {{{cta}}}

    {{{boton_ra}}}

    <div class="rows">
{{{filas}}}
    </div>

    {{{banda}}}

    {{{pie}}}
  </div>
  {{{franja}}}
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  var toast=document.getElementById('toast'),t;
  function show(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(t);t=setTimeout(function(){toast.classList.remove('on')},1600)}
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var v=b.getAttribute('data-copy');
      var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject();
      p.then(function(){show('Copiado')}).catch(function(){
        var r=document.createRange();r.selectNodeContents(b.parentNode.querySelector('.val'));var s=getSelection();s.removeAllRanges();s.addRange(r);show('Selecciona y copia');
      });
    });
  });
})();
</script>

</body>
</html>
