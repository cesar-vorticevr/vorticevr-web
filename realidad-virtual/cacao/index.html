/* ruido suave (para que la pasta, los trozos y los polvos no salgan perfectos) */
const hash=(x,y,z)=>{ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); };
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z), xf=x-xi,yf=y-yi,zf=z-zi, u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const c=(a,b,d)=>hash(xi+a,yi+b,zi+d);
  return lerp(lerp(lerp(c(0,0,0),c(1,0,0),u),lerp(c(0,1,0),c(1,1,0),u),v),lerp(lerp(c(0,0,1),c(1,0,1),u),lerp(c(0,1,1),c(1,1,1),u),v),w);
}
/* una bola irregular: el trozo de pasta, el montón de azúcar… */
function blob(r,detail=3,amp=.35,freq=3,seed=rnd(0,99)){
  const g=new THREE.IcosahedronGeometry(r,detail), p=g.attributes.position, v=V();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n=v.clone().normalize();
    const k=1+amp*(vnoise(n.x*freq+seed,n.y*freq,n.z*freq)-.5)*2+amp*.4*(vnoise(n.x*freq*3+seed,n.y*freq*3,n.z*freq*3)-.5);
    v.multiplyScalar(k); p.setXYZ(i,v.x,v.y,v.z); }
  g.computeVertexNormals(); return g;
}

let AC=null, noiseBuf=null;
function initAudio(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f1,f2,dur,type='sine',vol=.15,delay=0){
  if(!AC) return;
  try{ const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02); }catch(e){}
}
function noise(dur=.12,freq=1200,vol=.2,q=1){
  if(!AC) return;
  try{
    if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), t=AC.currentTime;
    s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f).connect(g).connect(AC.destination); s.start(t,Math.random()*.5,dur+.05);
  }catch(e){}
}

  molinillo:'wooden-back-scratcher',jarra:'terracotta-pitcher',jicara:'carved-earthen-vessel',titulo:'del-cacao-al-chocolat'};
const MOD={};
const SIGNS=['cosecha','desgrane','fermentado','secado','tostado','molido','titulo'];   // el letrero de cada fase (en la final, el del título)
const SIGN={};
const IMGS=['siguiente','humo-1','humo-2'];   // el botón Siguiente y el humo (de César)
const envTex=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment()).texture;
function loadModels(onProgress){
  const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder), keys=Object.keys(FILES), tl=new THREE.TextureLoader(); let n=0;
  const total=keys.length+SIGNS.length+IMGS.length, step=()=>onProgress(++n/total);
  return Promise.all([...keys.map(k=>loader.loadAsync('modelos/'+FILES[k]+'.glb').then(g=>{
    g.scene.traverse(o=>{ if(o.isMesh){ o.material.envMap=envTex; o.material.envMapIntensity=.7; } });
    MOD[k]=g.scene; }).catch(e=>console.warn('modelo',k,e)).finally(step)),
    ...[...SIGNS,...IMGS].map(k=>tl.loadAsync('letreros/'+k+'.webp').then(t=>{ t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; SIGN[k]=t; }).catch(e=>console.warn('letrero',k,e)).finally(step))]);
}
const _box=new THREE.Box3(), _sz=new THREE.Vector3(), _ct=new THREE.Vector3();
/* copia del modelo a la medida pedida en metros ({x, y, z}; los ejes que no se piden siguen la proporción), apoyada en y=0 y centrada en x/z */
function fit(k,dims){
  if(!MOD[k]) return null;
  const mid=new THREE.Group(), g=new THREE.Group(); mid.add(MOD[k].clone(true)); g.add(mid);
  mid.updateMatrixWorld(true); _box.setFromObject(mid); _box.getSize(_sz); _box.getCenter(_ct);
  const s={}; let sum=0,n=0; for(const a of 'xyz') if(dims[a]){ s[a]=dims[a]/(_sz[a]||1); sum+=s[a]; n++; }
  for(const a of 'xyz') if(!s[a]) s[a]=sum/n;
  mid.scale.set(s.x,s.y,s.z); mid.position.set(-_ct.x*s.x,-_box.min.y*s.y,-_ct.z*s.z);
  g.userData.size=V(_sz.x*s.x,_sz.y*s.y,_sz.z*s.z); return g;
}
/* el lado mayor (o el eje pedido) igual a size */
function model(k,size,axis){
  if(!MOD[k]) return null; _box.setFromObject(MOD[k]); _box.getSize(_sz);
  const a=axis||(_sz.x>=_sz.y&&_sz.x>=_sz.z?'x':_sz.y>=_sz.z?'y':'z'); return fit(k,{[a]:size});
}
/* un modelo con su centro en el origen (para lo que se toma con la mano) */
function centered(k,size,axis){ const g=model(k,size,axis); if(g) g.children[0].position.y-=g.userData.size.y/2; return g; }
/* altura (local de parent) del primer punto de obj bajo (x,z) mirando hacia abajo: el fondo de un cajón, un comal o una jícara */
const _ray=new THREE.Raycaster();
function floorAt(obj,parent,x,z,top=3){
  parent.updateMatrixWorld(true);
  const o=parent.localToWorld(V(x,top,z)), d=parent.localToWorld(V(x,top-1,z)).sub(o).normalize();
  _ray.set(o,d); const hit=_ray.intersectObject(obj,true)[0];
  return hit?parent.worldToLocal(hit.point.clone()).y:null;
}
/* estira el modelo en y para que su superficie bajo (x,z) quede a la altura top (mesas de al menos un metro) */
function raiseTo(obj,parent,x,z,top){
  const h=floorAt(obj,parent,x,z,4); if(!h) return top; const f=top/h, mid=obj.children[0];
  mid.scale.y*=f; mid.position.y*=f; obj.userData.size.y*=f; obj.updateMatrixWorld(true); return floorAt(obj,parent,x,z,4)??top;
}
/* geometría y material de un grano para InstancedMesh: el lado mayor mide size, centrada */
function beanGeo(k,size){
  if(!MOD[k]) return null; let mesh=null; MOD[k].traverse(o=>{ if(o.isMesh&&!mesh) mesh=o; }); if(!mesh) return null;
  MOD[k].updateMatrixWorld(true);
  const geo=mesh.geometry.clone().applyMatrix4(mesh.matrixWorld); geo.computeBoundingBox(); geo.boundingBox.getSize(_sz); geo.boundingBox.getCenter(_ct);
  geo.translate(-_ct.x,-_ct.y,-_ct.z); geo.scale(...Array(3).fill(size/Math.max(_sz.x,_sz.y,_sz.z)));
  const mat=mesh.material.clone(); return {geo,mat};
}
/* la caja del objeto en sus propias coordenadas (para saber si la mano lo toca, y para la física) */
function localBox(obj){
  obj.updateMatrixWorld(true); const inv=obj.matrixWorld.clone().invert(), b=new THREE.Box3(), t=new THREE.Box3(), m=new THREE.Matrix4();
  obj.traverse(o=>{ if(o.isMesh&&!o.userData.noGrab){ if(!o.geometry.boundingBox) o.geometry.computeBoundingBox(); t.copy(o.geometry.boundingBox).applyMatrix4(m.multiplyMatrices(inv,o.matrixWorld)); b.union(t); } });
  return b;
}
/* la punta de trabajo de una herramienta: el extremo más ancho de su lado largo (la hoja de la pala, el peine del rastrillo, la cuchara, la cabeza del molinillo) */
function wideEnd(obj){
  obj.updateMatrixWorld(true); const inv=obj.matrixWorld.clone().invert(), m=new THREE.Matrix4(), pts=[], v=V();
  obj.traverse(o=>{ if(!o.isMesh) return; m.multiplyMatrices(inv,o.matrixWorld); const p=o.geometry.attributes.position, st=Math.max(1,Math.floor(p.count/3000));
    for(let i=0;i<p.count;i+=st) pts.push(v.fromBufferAttribute(p,i).applyMatrix4(m).clone()); });
  const b=new THREE.Box3().setFromPoints(pts), s=b.getSize(V()), a=s.x>=s.y&&s.x>=s.z?'x':s.y>=s.z?'y':'z', o2=['x','y','z'].filter(k=>k!==a);
  const area=sel=>{ if(!sel.length) return 0; const z=new THREE.Box3().setFromPoints(sel).getSize(V()); return z[o2[0]]*z[o2[1]]; };
  const hiEnd=area(pts.filter(p=>p[a]>b.max[a]-s[a]*.25))>area(pts.filter(p=>p[a]<b.min[a]+s[a]*.25));
  const E=pts.filter(p=>hiEnd?p[a]>b.max[a]-s[a]*.1:p[a]<b.min[a]+s[a]*.1), c=V(); E.forEach(p=>c.add(p)); return c.divideScalar(Math.max(1,E.length));
}

/* ---------- texturas hechas a mano (canvas): petate, hojas, partículas, papel amate, madera ---------- */
const TEX={};
TEX.petate=canvas(1024,1024,(x,w)=>{
  const n=32, s=w/n;
  x.fillStyle='#8a6a3c'; x.fillRect(0,0,w,w);
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const hor=((i>>1)+(j>>1))%2===0;   // tejido de sarga: tiras de dos en dos
    const band=(j%16===3||j%16===4)&&hor||(i%16===3||i%16===4)&&!hor;
    const base=band?['#7a3b1c','#6b3218']:[['#d9b77a','#cfa96a','#e0c28a','#c8a060'][(i*7+j*3)%4],'#b88f52'];
    const X=i*s, Y=j*s, gr=hor?x.createLinearGradient(0,Y,0,Y+s):x.createLinearGradient(X,0,X+s,0);
    gr.addColorStop(0,base[1]); gr.addColorStop(.25,base[0]); gr.addColorStop(.75,base[0]); gr.addColorStop(1,base[1]);
    x.fillStyle=gr; x.fillRect(X+.6,Y+.6,s-1.2,s-1.2);
    x.strokeStyle='rgba(70,45,20,.35)'; x.lineWidth=1; x.beginPath();
    for(let k=0;k<3;k++){ const o=rnd(.2,.8)*s; if(hor){ x.moveTo(X+2,Y+o); x.lineTo(X+s-2,Y+o+rnd(-1,1)); } else { x.moveTo(X+o,Y+2); x.lineTo(X+o+rnd(-1,1),Y+s-2); } }
    x.stroke();
  }
});

/* ---- 7 · CHOCOLATE: la pasta a la jarra, se sirve en la jícara inclinando la jarra, y se bate con el molinillo dentro de la jícara ---- */
function mkChocolate(g){
  const tz=-.08, tb=mkTable(g,1.0,1.25,0,tz), T=tb.top;
  const choc=std(0x3a1c0f,{roughness:.3});
  // el plato con la pasta de cacao recién molida (irregular, brillante)
  const px=-.4, pz=tz+.06, pl=fit('comal',{x:.28}); let plY=T+.01;
  if(pl){ pl.position.set(px,T,pz); g.add(pl); plY=(floorAt(pl,g,px,pz,T+.5)??T+.01)+.002; } else M(new THREE.CylinderGeometry(.13,.11,.014,28),std(0xa0522d),px,T+.007,pz,g);
  const mound=M(blob(.075,4,.3,3),choc,px,plY+.012,pz,g); mound.scale.set(1,.42,.85); mound.rotation.y=rnd(0,6);
  for(let i=0;i<3;i++){ const ch=M(blob(.018,2,.45,5),choc,px+rnd(-.09,.09),plY+.008,pz+rnd(-.08,.08),g); ch.scale.y=.6; }
  const mC=V(px,plY+.03,pz);
  label('Pasta de cacao',g,px,T+.22,pz,.26);
  // la jarra de litro y medio, con agua caliente
  const jx=-.08, jz=tz-.04;
  const jarra=fit('jarra',{y:.23})||(()=>{ const j=new THREE.Group(); M(new THREE.CylinderGeometry(.06,.075,.23,20),std(0xa0522d),0,.115,0,j); j.userData.size=V(.15,.23,.15); return j; })();
  jarra.position.set(jx,T,jz); g.add(jarra);
  const jH=jarra.userData.size.y, jR=Math.min(jarra.userData.size.x,jarra.userData.size.z)*.3;
  const water=M(new THREE.CircleGeometry(jR,24),std(0x8a6a4a,{roughness:.15,transparent:true,opacity:.92}),0,jH*.82,0,jarra); water.rotation.x=-Math.PI/2; water.userData.noGrab=true;
  const J=grabbable(jarra,{pad:.04,upright:true}); J.enabled=false;
  const jLabel=label('Jarra',g,jx,T+jH+.14,jz,.17);
  // la jícara, más chica que la jarra
  const kx=.24, kz=tz+.06, jic=fit('jicara',{x:.15}); let kBot=T+.012, kTop=T+.08, kR=.06;
  if(jic){ jic.position.set(kx,T,kz); g.add(jic); kTop=T+jic.userData.size.y*.9; kBot=(floorAt(jic,g,kx,kz,T+.5)??T+.02)+.004; kR=jic.userData.size.x*.36; }
  else { M(new THREE.SphereGeometry(.075,20,10,0,Math.PI*2,Math.PI/2,Math.PI/2),std(0x6b2f1a,{side:THREE.DoubleSide}),kx,T+.075,kz,g).rotation.x=Math.PI; kTop=T+.07; }
  label('Jícara',g,kx,kTop+.15,kz,.18);
  const liq=M(new THREE.CircleGeometry(1,28),std(0x4a2414,{roughness:.18}),kx,kBot,kz,g); liq.rotation.x=-Math.PI/2; liq.visible=false;
  const foam=M(new THREE.CircleGeometry(1,28),std(0xffffff,{map:TEX.foam,roughness:.7,transparent:true}),kx,kBot+.002,kz,g); foam.rotation.x=-Math.PI/2; foam.visible=false;
  const stream=M(new THREE.CylinderGeometry(.006,.004,1,8),std(0x4a2414,{roughness:.2}),0,0,0,g); stream.visible=false;
  const puddle=M(new THREE.CircleGeometry(1,20),std(0x4a2414,{roughness:.2}),0,T+.002,0,g); puddle.rotation.x=-Math.PI/2; puddle.visible=false; let pudS=0;
  // el molinillo, acostado en la mesa
  const mol=fit('molinillo',{y:.3})||(()=>{ const m=new THREE.Group(); M(new THREE.CylinderGeometry(.007,.007,.26,8),std(0xc8a06a),0,.13,0,m); M(new THREE.CylinderGeometry(.024,.018,.04,10),std(0xb98952),0,.27,0,m); m.userData.size=V(.05,.3,.05); return m; })();
  mol.position.set(.5,T+.025,tz-.14); mol.rotation.set(0,.4,Math.PI/2); g.add(mol);
  const MO=grabbable(mol,{tip:true,pad:.04,tipFloor:(x,z)=>xzDist(V(x,0,z),kx,kz)<kR+.01?kBot+.006:supportAt(x,z)}); MO.enabled=false;
  const inHand=[null,null]; let balls=0, fill=0, whisk=0, st=0, sw=0, step=1;
  const cWater=C(0x8a6a4a), cChoc=C(0x3d1d0e);
  return {desk:['h',T+.14],
    tryGrab(h){ if(step!==1) return false; if(near(h,mC)<.12){ const o=M(blob(.022,2,.4,4),choc,0,0,0,g); o.scale.y=.75; o.position.copy(toPg(h.pos)); inHand[h.i]=o; sfx.pick(); haptic(h,.4,25); return true; } return false; },
    update(dt,t){
      // 1) los trozos de pasta a la jarra
      for(const h of H){ const o=inHand[h.i]; if(!o) continue;
        if(h.active&&h.grab){ o.position.lerp(toPg(h.pos),.6); o.rotation.y+=dt*2; continue; }
        inHand[h.i]=null;
        if(xzDist(o.position,jarra.position.x,jarra.position.z)<.22){ fly(o,V(jarra.position.x,T+jH*.8,jarra.position.z),.35,.1,()=>{ g.remove(o); balls++; sfx.plop(); burst(V(jarra.position.x,T+jH,jarra.position.z),'drop',10,{color:0x6b3a22,spd:.6}); water.material.color.copy(cWater).lerp(cChoc,balls/3);
          if(balls>=3){ step=2; J.enabled=true; sfx.good(5); burst(V(jx,T+jH+.05,jz),'spark',16); } }); }
        else fly(o,mC,.3,.08,()=>g.remove(o));
      }

      let pouring=false;
      if(step===2){
        if(MODE==='desk'&&J.held){ const over=xzDist(jarra.position,kx,kz)<.2; if(over){ const d=V(kx-jarra.position.x,0,kz-jarra.position.z).normalize(); const reach=jH*.95*Math.sin(1.15)+jR*1.1; jarra.position.x=kx-d.x*reach; jarra.position.z=kz-d.z*reach; jarra.position.y=Math.max(jarra.position.y,kTop-.02); jarra.quaternion.setFromAxisAngle(V(d.z,0,-d.x),1.15); jarra.updateMatrix(); } }

        water.visible=tilt<.5;
        if(tilt>.85&&(J.held||MODE==='desk')){
          const hd=V(up.x,0,up.z).normalize(), mouth=V(0,jH*.95,0).applyMatrix4(jarra.matrix).addScaledVector(hd,jR*1.1);
          const inJ=xzDist(mouth,kx,kz)<kR+.03, endY=inJ?kBot+fill*(kTop-kBot)*.8:supportAt(mouth.x,mouth.z)+.002, end=V(mouth.x,endY,mouth.z);
          stream.visible=true; stream.position.lerpVectors(mouth,end,.5); stream.scale.set(1+Math.sin(t*30)*.15,Math.max(.01,mouth.distanceTo(end)),1); stream.quaternion.setFromUnitVectors(V(0,1,0),end.clone().sub(mouth).normalize());

          if(inJ){ fill=Math.min(1,fill+dt/4); liq.visible=foam.visible=true; if(Math.random()<dt*10) burst(end,'drop',1,{color:0x4a2414,spd:.3}); if(J.held&&Math.random()<dt*6) haptic(J.held,.2,15); }
          else { pudS=Math.min(.09,pudS+dt*.03); puddle.visible=true; puddle.position.set(end.x,endY,end.z); puddle.scale.setScalar(pudS); if(Math.random()<dt*12) burst(end,'drop',1,{color:0x4a2414,spd:.4}); }
          if(fill>=1){ step=3; MO.enabled=true; sfx.good(7); burst(V(kx,kTop+.05,kz),'spark',18); }
        }
      }
      if(!pouring) stream.visible=false;
      if(liq.visible){ const y=kBot+fill*(kTop-kBot)*.8, r=kR*(.5+.5*Math.min(1,fill*1.4)); liq.position.y=y; liq.scale.setScalar(r); foam.position.y=y+.002; foam.scale.setScalar(r*(.2+.8*whisk/5)); foam.material.opacity=Math.min(1,whisk/1.5); foam.rotation.z+=dt*.3; }
      // 3) batir con el molinillo dentro de la jícara, unos cinco segundos
      if(step===3&&MO.held){ const tp=MO.tipP, inK=xzDist(tp,kx,kz)<kR+.015&&tp.y<kTop+.02;
        const active=inK&&(speedXZ(MO.tipVel)>.06||MO.spin>2.5);
        if(active){ whisk=Math.min(5,whisk+dt); sw-=dt; if(sw<=0){ sw=.12; sfx.swish(); haptic(MO.held,.35,20); } if(Math.random()<dt*14) burst(V(kx+rnd(-.03,.03),liq.position.y+.01,kz+rnd(-.03,.03)),'dust',1,{color:0xe8cfa8,size:.35,spd:.1}); }
        if(whisk>=5) finish(); }
      st-=dt; if(st<=0){ st=.3; const sp=step===3||fill>0?V(kx+rnd(-.03,.03),kTop,kz):V(jarra.position.x+rnd(-.02,.02),jarra.position.y+jH,jarra.position.z); smoke(sp,{size:.06,alpha:.35,life:2.4,rise:.08}); }
      jLabel.visible=!J.held;
      ui.progress=balls/3*.3+fill*.35+whisk/5*.35;
      ui.hint=step===1?mC.clone():step===2?(J.held?V(kx,kTop+.08,kz):jarra.position.clone().add(V(0,jH*.6,0))):(!MO.held?mol.position.clone():V(kx,kTop,kz));
      ui.instr=step===1?'Toma un trozo de pasta de cacao y échalo a la jarra con agua caliente ('+balls+'/3)'
        :step===2?(MODE==='desk'?'Arrastra la jarra junto a la jícara para servir':'Toma la jarra, acércala a la jícara e inclínala para servir el chocolate')
        :whisk<5?'Toma el molinillo, mételo en la jícara y bátelo hasta que haga espuma ('+Math.ceil(5-whisk)+' s)':'¡A tomar chocolate!';
    }};

/* el letrero de la fase: entra grande frente a ti con destellos y luego se acomoda arriba del panel */
const signMat=new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,toneMapped:false,side:THREE.DoubleSide});
const sign=new THREE.Mesh(new THREE.PlaneGeometry(1,1),signMat); sign.visible=false; sign.renderOrder=2; stage.add(sign);
const SIGN_IN={p:V(0,1.55,.05),ry:0,w:.62}, SIGN_SLOT={p:V(PANEL.p.x,1.83,PANEL.p.z),ry:PANEL.ry,w:.5};
let signT=99, signAsp=.34;
function showSign(i){
  const tex=SIGN[SIGNS[i]]; if(!tex){ sign.visible=false; return; }
  signMat.map=tex; signMat.needsUpdate=true; signAsp=tex.image.height/tex.image.width; signT=0; sign.visible=true;
  for(let k=0;k<30;k++){ const a=k/30*6.283; burst(V(SIGN_IN.p.x+Math.cos(a)*.35,SIGN_IN.p.y+Math.sin(a)*.18,SIGN_IN.p.z),'spark',1,{spd:.1,life:1.2,vel:V(Math.cos(a)*.3,Math.sin(a)*.3,0)}); }
  burst(SIGN_IN.p,'petal',10,{spd:.5,up:.6,spread:.2});
}
function updSign(dt,t){
  if(!sign.visible) return; signT+=dt;
  const k=signT<.5?backOut(signT/.5):1, m=clamp((signT-2.6)/.9,0,1), e=m*m*(3-2*m), w=Math.max(.001,lerp(SIGN_IN.w,SIGN_SLOT.w,e)*k);
  sign.position.lerpVectors(SIGN_IN.p,SIGN_SLOT.p,e); sign.position.y+=Math.sin(e*Math.PI)*.12+Math.sin(t*1.3)*.008;
  sign.rotation.y=lerp(SIGN_IN.ry,SIGN_SLOT.ry,e); sign.rotation.z=signT<.5?(1-k)*.3:Math.sin(t*1.1)*.012; sign.scale.set(w,w*signAsp,1);
  if(m>0&&m<1&&Math.random()<dt*30) burst(sign.position,'spark',1,{spd:.1,life:.6,size:.6,spread:.1});
}

renderer.setAnimationLoop(ms=>{
  const t=ms/1000, dt=clamp(t-last,.001,.05); last=t;
  // se coloca cuando el visor ya sabe dónde estás, y nunca más se vuelve a acomodar
  if((MODE==='ar'||MODE==='vr')&&!placed){ placeT+=dt; if(placeT>.8&&(camera.position.y>.4||placeT>2.5)){ placeStage(); if(cur<0) gotoPhase(0); } }
  if(MODE&&placed){
    updateHands(dt);
    updateGrabs(dt,t);
    if(phase){ pop=Math.min(1,pop+dt*2.2); pg.scale.setScalar(Math.max(.001,backOut(pop))); phase.update(dt,t); }
    for(const s of pg?pg.children:[]) if(s.isSprite&&s.userData.y0!==undefined) s.position.y=s.userData.y0+Math.sin(t*1.5+s.userData.ph)*.006;
    if(ui.done){ doneT+=dt; btnCool-=dt;
      if(!btn.visible&&doneT>.9){ btn.visible=true; btnCool=.4; btn.scale.setScalar(.01); burst(btn.position,'spark',14); }
      if(btn.visible){ btn.scale.setScalar(Math.min(1,btn.scale.x+dt*4)); btn.position.y=BTN.p.y+Math.sin(t*3)*.01; btnImg.scale.x=.34*(1+Math.sin(t*4)*.03);
        btnGlow.material.opacity=.4+Math.sin(t*5)*.2;
        for(const h of H){ if(!h.active||btnCool>0||h.held) continue; const d=Math.min(h.tip.distanceTo(btn.position),near(h,btn.position));
          // con el ratón basta un clic encima del letrero (el plano de la fase puede quedar lejos de él)
          const deskHit=MODE==='desk'&&h.start&&ray.intersectObject(btn,true).length>0;
          if(deskHit||d<.08||(h.start&&d<.15)){ btnCool=1; burst(btn.position,'spark',20,{spd:.8}); burst(btn.position,'petal',8); tone(700,1100,.12,'triangle',.15); haptic(h,.8,40); gotoPhase((cur+1)%PHASES.length); break; } } }
      if(finaleT>0){ finaleT-=dt; if(Math.random()<dt*6) burst(V(rnd(-.7,.7),rnd(1.7,2.1),rnd(-.6,.3)),'petal',2,{spd:.1,up:0,life:3}); if(Math.random()<dt*5) burst(V(rnd(-.5,.5),rnd(1,1.6),rnd(-.4,.2)),'spark',4,{spd:.3}); }
    }
    if(titulo){ titulo.position.y=TITLE.p.y+Math.sin(t*1.2)*.015; titulo.rotation.y=TITLE.ry+Math.sin(t*.6)*.06; }
    updSign(dt,t); updHint(dt,t);
    drawPanel();
  }
  updTweens(dt); updParts(dt,t); updSmoke(dt); updShock(dt);
  renderer.render(scene,camera);
});

async function enterXR(mode){
  initAudio(); $('msg').textContent='';
  try{
    const session=await navigator.xr.requestSession(mode==='ar'?'immersive-ar':'immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
    MODE=mode; env.visible=mode==='vr'; placed=false; placeT=0; stage.visible=false; cur=-1; if(pg){ stage.remove(pg); pg=null; phase=null; }
    $('menu').classList.add('hide'); $('hint').style.display='none';
    session.addEventListener('end',()=>{ MODE=null; stage.visible=false; env.visible=false; $('menu').classList.remove('hide'); });
  }catch(e){ console.warn(e); $('msg').textContent='No se pudo iniciar: '+(e&&e.message||e); }
}
function enterDesk(){
  initAudio(); MODE='desk'; env.visible=true; $('menu').classList.add('hide'); $('hint').style.display='block';
  camera.position.set(0,1.62,1.75); stage.position.set(0,0,0); stage.scale.setScalar(1); stage.rotation.y=0; stage.updateMatrixWorld(true);
  camera.lookAt(0,1.05,-.1); stage.visible=true; placed=true; gotoPhase(0);
}
$('bAR').onclick=()=>enterXR('ar'); $('bVR').onclick=()=>enterXR('vr'); $('bDesk').onclick=enterDesk;
(async()=>{
  $('bDesk').disabled=true;
  await Promise.race([loadModels(p=>{ $('msg').textContent='Cargando el cacaotal… '+Math.round(p*100)+' %'; }),new Promise(r=>setTimeout(r,60000))]);
  buildDecor(); $('bDesk').disabled=false;
  let ar=false,vr=false;
  if(navigator.xr){ try{ ar=await navigator.xr.isSessionSupported('immersive-ar'); }catch(e){} try{ vr=await navigator.xr.isSessionSupported('immersive-vr'); }catch(e){} }
  $('bAR').disabled=!ar; $('bVR').disabled=!vr;
  $('msg').textContent=ar||vr?'Activa el seguimiento de manos en tu visor y deja los controles a un lado.'
    :(isSecureContext?'Este dispositivo no tiene modo inmersivo: ábrelo en el navegador del visor, o pruébalo aquí con ratón.':'WebXR necesita HTTPS: sube este archivo a tu sitio y ábrelo desde el navegador del visor.');
})();
window.__cacao={gotoPhase,H,MOD,camera,stage,renderer,scene,get grabs(){return grabs;},get pg(){return pg;},get ui(){return ui;},get cur(){return cur;},get phase(){return phase;},finish};
</script>
