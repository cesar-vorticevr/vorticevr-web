<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Observatorio Orbital Vórtice</title>
<meta name="description" content="Laboratorio espacial interactivo en 3D de Vórtice VR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --void:#05020b; --deep:#0d0620; --panel:rgba(16,8,32,.84); --panel2:rgba(40,18,72,.55);
  --line:rgba(190,150,255,.18); --line2:rgba(190,150,255,.45);
  --vortex:#8b3fd6; --vortex-d:#5a1f8f; --lav:#d2b8ff; --ink:#f2ecff; --mute:#a99bcb;
  --sun:#ffbe55; --ok:#74e8ba; --warn:#ff7a95; --blood:#e0573a;
  --fd:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--fb);font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 60% 40%,#140a2a 0%,#070312 55%,#030108 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.hover{cursor:pointer}

/* ---------- visor ---------- */
#visor{position:absolute;inset:0;pointer-events:none;z-index:2;transition:opacity .6s}
#visor::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 78% 72% at 50% 50%,transparent 62%,rgba(40,10,80,.35) 82%,rgba(4,1,10,.92) 100%)}
#visor::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(210,184,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
#visor .br{position:absolute;width:38px;height:38px;border:2px solid var(--line2)}
#visor .tl{top:66px;left:88px;border-right:0;border-bottom:0}
#visor .tr{top:66px;right:404px;border-left:0;border-bottom:0}
#visor .bl{bottom:100px;left:88px;border-right:0;border-top:0}
#visor .brr{bottom:100px;right:404px;border-left:0;border-top:0}
#visor .reticle{position:absolute;left:calc(50% - 150px);top:50%;width:26px;height:26px;margin:-13px;opacity:.35}
#visor.off{opacity:0}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:18px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(180deg,rgba(5,2,11,.92),rgba(5,2,11,0))}
#top .logo{height:26px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(139,63,214,.6))}
#top .ttl{display:flex;flex-direction:column;line-height:1.1;border-left:1px solid var(--line2);padding-left:14px}
#top .ttl b{font-family:var(--fd);font-weight:600;letter-spacing:.22em;font-size:14px;text-transform:uppercase}
#top .ttl span{font-size:11px;color:var(--mute);letter-spacing:.08em}
#top .tele{margin-left:auto;display:flex;gap:18px;font-family:var(--fm);font-size:11px;color:var(--mute)}
#top .tele div{display:flex;flex-direction:column;gap:2px}
#top .tele em{font-style:normal;color:var(--lav);font-size:9.5px;letter-spacing:.18em;font-family:var(--fd)}
#top .tele strong{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
#top .acts{display:flex;gap:6px}
.ib{height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);border-radius:3px;font-family:var(--fd);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(20,8,40,.6);transition:background .2s,border-color .2s,transform .15s}
.ib:hover{background:rgba(139,63,214,.35);border-color:var(--lav)}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--vortex);border-color:var(--lav);box-shadow:0 0 16px rgba(139,63,214,.6)}
.ib svg{width:16px;height:16px}
#btnLog{display:none}

/* ---------- mode rail ---------- */
#modes{position:absolute;z-index:6;left:12px;top:72px;bottom:104px;width:66px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.mb{position:relative;flex:0 0 auto;width:66px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:rgba(14,6,28,.72);border-radius:3px;font-family:var(--fd);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);line-height:1.1;text-align:center;padding:6px 3px;transition:all .25s}
.mb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mb:hover{color:var(--ink);border-color:var(--line2)}
.mb:hover svg{transform:scale(1.18) rotate(-8deg)}
.mb.on{color:#fff;border-color:var(--lav);background:linear-gradient(160deg,var(--vortex),var(--vortex-d));box-shadow:0 0 22px rgba(139,63,214,.55),inset 0 0 12px rgba(255,255,255,.12)}
.mb.on::before{content:"";position:absolute;left:-7px;top:50%;width:3px;height:60%;transform:translateY(-50%);background:var(--sun);box-shadow:0 0 8px var(--sun)}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:6;right:12px;top:72px;bottom:12px;width:380px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
#panel::before,#panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--sun);pointer-events:none}
#panel::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
#panel::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.ptabs{display:flex;border-bottom:1px solid var(--line2);flex:0 0 auto}
.ptabs button{flex:1;padding:12px 8px 10px;font-family:var(--fd);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);position:relative}
.ptabs button.on{color:var(--ink)}
.ptabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;background:var(--lav);box-shadow:0 0 10px var(--lav)}
.ptabs .x{display:none;flex:0 0 44px}
.pbody{flex:1;overflow-y:auto;padding:16px 18px 28px;scrollbar-width:thin;scrollbar-color:var(--vortex-d) transparent}
.pbody h2{font-family:var(--fd);font-weight:600;font-size:22px;letter-spacing:.02em;margin:2px 0 4px;text-wrap:balance;line-height:1.15}
.pbody .kick{font-family:var(--fd);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--sun)}
.pbody p{line-height:1.58;color:#ddd3f3;margin:0 0 10px}
.pbody b,.pbody strong{color:#fff;font-weight:600}
.pbody .lead{font-size:14.5px;color:var(--ink)}
.sec{border-top:1px solid var(--line);margin-top:12px;padding-top:4px;animation:rise .5s both}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 0;font-family:var(--fd);font-weight:600;font-size:14.5px;letter-spacing:.03em}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--lav);border-bottom:2px solid var(--lav);transform:rotate(-45deg);transition:transform .25s;flex:0 0 auto}
.sec[open]>summary::before{transform:rotate(45deg)}
.sec>summary i{font-style:normal;margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--mute);font-weight:400}
.sec[open]>div{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{border-left:2px solid var(--sun);padding:6px 0 6px 12px;margin:8px 0 12px;font-style:italic;color:#f4e6c8;line-height:1.5}
.q cite{display:block;font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--sun);margin-top:4px}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:10px 0 12px;border-radius:3px;overflow:hidden}
.readout div{background:rgba(10,4,22,.9);padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.readout em{font-style:normal;font-family:var(--fd);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.readout strong{font-family:var(--fm);font-weight:500;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.readout .wide{grid-column:1/-1}
.readout .hi strong{color:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{padding:7px 11px;border:1px solid var(--line2);border-radius:20px;font-size:12px;background:rgba(40,18,72,.4);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--lav);background:rgba(139,63,214,.3);transform:translateY(-1px)}
.chip.on{background:var(--vortex);border-color:var(--lav);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin:6px 0;border:1px solid var(--sun);color:#1a0d00;background:linear-gradient(135deg,#ffd27f,#ff9f3a);font-family:var(--fd);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;border-radius:3px;box-shadow:0 0 20px rgba(255,170,60,.35);transition:transform .15s,box-shadow .2s}
.cta:hover{box-shadow:0 0 30px rgba(255,170,60,.6)}
.cta:active{transform:scale(.97)}
.cta.alt{background:linear-gradient(135deg,#a45cf0,#5a1f8f);color:#fff;border-color:var(--lav);box-shadow:0 0 20px rgba(139,63,214,.4)}
.cta.blood{background:linear-gradient(135deg,#f07a52,#8c1f10);color:#fff;border-color:#ffb199;box-shadow:0 0 20px rgba(224,87,58,.4)}
.timeline{display:flex;flex-direction:column;gap:4px;margin:8px 0 12px}
.era{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(20,8,40,.5);text-align:left;transition:all .2s}
.era:hover{border-color:var(--lav);transform:translateX(3px)}
.era.now{border-color:var(--sun);background:linear-gradient(90deg,rgba(255,190,85,.18),rgba(20,8,40,.5));box-shadow:0 0 16px rgba(255,190,85,.15)}
.era .g{font-size:20px;text-align:center;color:var(--lav)}
.era.now .g{color:var(--sun)}
.era b{font-family:var(--fd);font-size:13px;display:block}
.era span{font-size:11.5px;color:var(--mute)}
.era small{font-family:var(--fm);font-size:10.5px;color:var(--mute);white-space:nowrap}
.tool{border:1px solid var(--line2);background:rgba(40,18,72,.35);border-radius:4px;padding:12px;margin:10px 0}
.tool label{display:block;font-family:var(--fd);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.tool input,.tool select{width:100%;padding:9px 10px;background:rgba(5,2,11,.8);border:1px solid var(--line2);border-radius:3px;color:var(--ink);font-family:var(--fm);font-size:13px}
.tool .out{margin-top:10px;line-height:1.55}
.wt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.wt div{background:rgba(5,2,11,.7);border:1px solid var(--line);border-radius:3px;padding:7px 8px;font-size:11px;color:var(--mute)}
.wt b{display:block;font-family:var(--fm);font-size:13px;color:var(--ink);font-weight:500}
.cyc{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cyc svg{width:54px;height:54px}
.cyc b{font-family:var(--fd);font-size:14px;display:block}
.cyc .v{font-family:var(--fm);font-size:11.5px;color:var(--sun)}
.cyc p{font-size:12.5px;margin:4px 0 4px}
.cyc button{font-size:11px;color:var(--lav);font-family:var(--fd);letter-spacing:.1em;text-transform:uppercase}
.cyc button:hover{color:#fff}
/* ficha */
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.fhead canvas{width:84px;height:84px;flex:0 0 auto;border-radius:50%;box-shadow:0 0 30px rgba(139,63,214,.4)}
.frow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:baseline}
.frow em{font-style:normal;font-family:var(--fd);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.frow strong{font-family:var(--fm);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vortex),var(--lav));border-radius:3px;width:0;transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.fun{margin-top:12px;padding:10px 12px;border:1px solid rgba(255,190,85,.4);background:rgba(255,190,85,.07);border-radius:3px;font-size:12.5px;line-height:1.5}
.fun em{font-style:normal;font-family:var(--fd);font-size:10px;letter-spacing:.18em;color:var(--sun);display:block;margin-bottom:3px}

/* ---------- dock ---------- */
#dock{position:absolute;z-index:6;left:90px;right:404px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tc{display:flex;gap:4px;align-items:center}
.tc .ib{height:32px}
#playBtn{min-width:42px;background:var(--vortex);border-color:var(--lav)}
.spd{font-family:var(--fm);font-size:11.5px;color:var(--lav);min-width:84px;text-align:center}
.clock{display:flex;flex-direction:column;line-height:1.15;min-width:150px}
.clock em{font-style:normal;font-family:var(--fd);font-size:9.5px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.clock strong{font-family:var(--fm);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.sl{flex:1 1 200px;display:flex;align-items:center;gap:8px;min-width:160px}
.sl input{flex:1;accent-color:var(--vortex);height:22px;min-width:0}
.sl span{font-family:var(--fm);font-size:11px;color:var(--mute);white-space:nowrap}
.tg{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 100%}
.tg .chip{padding:5px 10px;font-size:11px}

/* ---------- tags & hotspots ---------- */
#tags{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-family:var(--fd);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);white-space:nowrap;transform-origin:0 50%;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform}
.tag::before{content:"";display:inline-block;width:14px;height:1px;background:currentColor;vertical-align:middle;margin-right:5px;opacity:.7}
.tag.sel{color:var(--sun)}
.tag.cons{font-size:10px;color:rgba(210,184,255,.75);letter-spacing:.2em}
.tag.cons::before{display:none}
.tag.cons.hl{color:var(--sun);font-size:12.5px;text-shadow:0 0 12px rgba(255,190,85,.9),0 0 3px #000}
.tag.sign{font-size:10px;color:rgba(116,232,186,.85);letter-spacing:.14em}
.tag.sign::before{display:none}
.hs{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;will-change:transform}
.hs i{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--sun) 24% 48%,rgba(255,190,85,0) 52%);box-shadow:0 0 12px var(--sun)}
.hs::before,.hs::after{content:"";position:absolute;inset:0;border:1.5px solid var(--sun);border-radius:50%;animation:ping 2.2s infinite ease-out}
.hs::after{animation-delay:1.1s}
.hs span{position:absolute;left:30px;top:50%;transform:translateY(-50%);font-family:var(--fd);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#ffe2ad;white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;opacity:.9;transition:opacity .2s}
.hs:hover span{opacity:1;color:#fff}
.hs:hover i{transform:scale(1.25)}
.hs.alt::before,.hs.alt::after{border-color:var(--lav)}
.hs.alt i{background:radial-gradient(circle,#fff 0 22%,var(--lav) 24% 48%,rgba(0,0,0,0) 52%);box-shadow:0 0 12px var(--lav)}
.hs.alt span{color:#e6d8ff}
@keyframes ping{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.ripple{position:absolute;z-index:4;pointer-events:none;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:2px solid var(--lav);animation:rip .7s ease-out forwards}
.ripple.b{border-color:var(--sun);animation-delay:.08s;opacity:0}
@keyframes rip{0%{transform:scale(.1);opacity:1}100%{transform:scale(1.4);opacity:0}}

/* ---------- popup ---------- */
#pop{position:absolute;z-index:9;width:340px;max-width:calc(100vw - 32px);background:linear-gradient(170deg,rgba(40,16,74,.96),rgba(12,5,26,.97));border:1px solid var(--lav);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(139,63,214,.35);padding:16px 18px 16px;opacity:0;pointer-events:none;transform:scale(.9);transform-origin:var(--ox,0) var(--oy,0);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#pop.on{opacity:1;pointer-events:auto;transform:none}
#pop::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(210,184,255,.18) 50%,transparent);background-size:100% 30%;background-repeat:no-repeat;animation:scan 1.1s ease-out 1;pointer-events:none}
@keyframes scan{from{background-position:0 -40%}to{background-position:0 140%}}
#pop .k{font-family:var(--fd);font-size:10px;letter-spacing:.22em;color:var(--sun);text-transform:uppercase}
#pop h3{font-family:var(--fd);font-size:19px;font-weight:600;margin:3px 0 8px;line-height:1.15;text-wrap:balance;padding-right:26px}
#pop .b{font-size:13px;line-height:1.55;color:#e4dbf7;max-height:46vh;overflow-y:auto}
#pop .b p{margin:0 0 8px}
#pop .b b{color:#fff}
#pop .cl{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--mute)}
#pop .cl:hover{color:#fff;background:rgba(255,255,255,.08)}
#pop .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ---------- guide ---------- */
#guide{position:absolute;z-index:5;left:92px;bottom:118px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;max-width:360px}
#guide svg{width:62px;height:62px;flex:0 0 auto;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(139,63,214,.6));pointer-events:auto;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(5deg)}}
#bubble{background:rgba(245,238,255,.95);color:#1c0d33;border-radius:12px 12px 12px 2px;padding:9px 12px;font-size:12.5px;line-height:1.45;margin-bottom:34px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .4s,transform .4s;pointer-events:auto}
#bubble b{color:#5a1f8f}
#bubble.hide{opacity:0;transform:translateY(8px) scale(.95);pointer-events:none}

/* ---------- mode flash ---------- */
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(210,184,255,.35),rgba(139,63,214,.15) 40%,transparent 70%);opacity:0}
#flash.go{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#modeTitle{position:absolute;z-index:4;left:50%;top:84px;transform:translateX(calc(-50% - 140px));text-align:center;pointer-events:none;opacity:0}
#modeTitle.go{animation:mt 2.6s ease-out}
#modeTitle em{display:block;font-style:normal;font-family:var(--fd);letter-spacing:.4em;font-size:11px;color:var(--sun)}
#modeTitle b{font-family:var(--fd);font-weight:700;font-size:clamp(22px,3.4vw,40px);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 30px rgba(139,63,214,.9)}
@keyframes mt{0%{opacity:0;letter-spacing:.6em;filter:blur(8px)}15%{opacity:1;letter-spacing:.14em;filter:blur(0)}75%{opacity:1}100%{opacity:0}}

/* ---------- overlays: eclipse & maya ---------- */
.ov{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .6s}
.ov.on{opacity:1;pointer-events:auto}
#ecl canvas{flex:1;width:100%;min-height:0;display:block}
.ovbar{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;background:rgba(10,4,22,.78);border:1px solid var(--line2);border-radius:4px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ovbar input[type=range]{flex:1 1 180px;accent-color:var(--sun)}
.ovtop{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.ovtop .cap{max-width:560px;pointer-events:none}
.ovtop .cap em{font-style:normal;font-family:var(--fd);font-size:10.5px;letter-spacing:.3em;color:var(--sun);text-transform:uppercase}
.ovtop .cap h3{font-family:var(--fd);font-size:clamp(20px,3vw,32px);margin:4px 0 6px;letter-spacing:.06em;text-shadow:0 0 20px rgba(0,0,0,.8)}
.ovtop .cap p{margin:0;font-size:13.5px;line-height:1.5;color:#efe6ff;text-shadow:0 1px 6px #000;max-width:52ch}
.ovtop .ib{pointer-events:auto}
#mayaCard{position:absolute;z-index:7;left:92px;top:78px;width:340px;background:var(--panel);border:1px solid var(--sun);border-radius:4px;padding:12px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(255,190,85,.15);transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .4s}
#mayaCard.off{transform:translateX(-30px);opacity:0;pointer-events:none}
#mayaCard canvas{width:100%;height:auto;aspect-ratio:1.45;display:block}
#mayaCard h4{margin:0;font-family:var(--fd);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun);display:flex;justify-content:space-between;align-items:center}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mrow .ib{height:30px;font-size:10px}
.mdate{font-family:var(--fm);font-size:12px;line-height:1.55;margin-top:6px}
.mdate b{color:var(--sun);font-weight:500}

/* ---------- boot ---------- */
#boot{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#1d0b3a 0%,#07030f 60%,#020006 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .9s,visibility .9s;padding:0 16px;text-align:center}
#boot.done{opacity:0;visibility:hidden}
#boot .mk{width:110px;height:auto;animation:spin 7s linear infinite;filter:drop-shadow(0 0 30px rgba(139,63,214,.9))}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .bl{height:30px;width:auto;opacity:.95}
#boot .lines{font-family:var(--fm);font-size:12px;color:var(--mute);min-height:92px;text-align:left;width:min(360px,100%)}
#boot .lines div{animation:rise .3s both}
#boot .lines span{color:var(--ok)}
#boot .pb{width:min(360px,100%);height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#boot .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vortex),var(--sun));transition:width .3s}
#boot .by{font-family:var(--fd);font-size:10.5px;letter-spacing:.35em;color:var(--lav);text-transform:uppercase}

/* ---------- responsive ---------- */
@media (max-width:1100px){#panel{width:340px}#dock{right:364px}#visor .tr,#visor .brr{right:364px}#modeTitle{transform:translateX(calc(-50% - 120px))}}
@media (max-width:820px){
  #top{gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
  #top .ttl span,#top .tele .hide-m{display:none}
  #top .ttl{padding-left:10px}
  #top .ttl b{font-size:11px;letter-spacing:.14em}
  #top .logo{height:20px}
  #top .tele{gap:10px;font-size:10px}
  #top .acts .ib.opt{display:none}
  #btnLog{display:inline-flex}
  #modes{left:0;right:0;top:auto;bottom:0;width:auto;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(5,2,11,.94);border-top:1px solid var(--line2);gap:5px}
  .mb{width:68px;min-height:52px;font-size:8.5px}
  .mb.on::before{left:50%;top:-7px;width:50%;height:3px;transform:translateX(-50%)}
  #dock{left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:7px 9px;gap:6px 8px}
  .clock{min-width:0}
  .sl{flex:1 1 100%;order:5}
  .tg{order:6;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tg .chip{flex:0 0 auto}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:72vh;z-index:12;transform:translateY(105%);border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .ptabs .x{display:block}
  #guide{left:10px;bottom:auto;top:62px;max-width:calc(100vw - 20px)}
  #guide svg{width:46px;height:46px}
  #bubble{margin-bottom:0;margin-top:0;font-size:12px;border-radius:2px 12px 12px 12px}
  #guide{align-items:flex-start}
  #visor .br{display:none}
  #visor .reticle{left:50%}
  #modeTitle{transform:translateX(-50%);top:120px}
  #mayaCard{left:8px;right:8px;width:auto;top:auto;bottom:calc(170px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto}
  #mayaCard canvas{aspect-ratio:1.9}
  #pop{left:16px!important;right:16px;top:auto!important;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

  <canvas id="gl" aria-label="Vista 3D del observatorio"></canvas>
  <div id="visor">
    <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
    <svg class="reticle" viewBox="0 0 26 26" fill="none" stroke="#d2b8ff" stroke-width="1"><circle cx="13" cy="13" r="6"/><path d="M13 0v7M13 19v7M0 13h7M19 13h7"/></svg>
  </div>

      <div class="hide-m"><em>Hora · CDMX</em><strong id="tTime">—</strong></div>
      <div class="hide-m"><em>Velocidad</em><strong id="tSpd">—</strong></div>

      <button class="ib opt" id="btnFull" title="Pantalla completa" aria-label="Pantalla completa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg></button>

  <div id="dock">

      <button class="ib" id="playBtn" aria-label="Pausa"><svg viewBox="0 0 16 16" fill="currentColor" id="playIco"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button class="ib" id="fastBtn" aria-label="Más rápido"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 3l6 5-6 5zM8 3l6 5-6 5z"/></svg></button>
      <span class="spd" id="spdLbl">—</span>
      <button class="ib" id="nowBtn">Ahora</button>
    </div>

      <rect x="18" y="36" width="28" height="20" rx="8" fill="#ece6f7" stroke="#5a1f8f" stroke-width="1.5"/>
      <rect x="26" y="41" width="12" height="7" rx="1.5" fill="#8b3fd6"/><circle cx="29" cy="44.5" r="1.2" fill="#ffbe55"/><circle cx="33" cy="44.5" r="1.2" fill="#74e8ba"/>
      <rect x="10" y="38" width="9" height="14" rx="4" fill="#ece6f7" stroke="#5a1f8f" stroke-width="1.5" transform="rotate(-18 14 44)"/>
      <rect x="45" y="36" width="9" height="14" rx="4" fill="#ece6f7" stroke="#5a1f8f" stroke-width="1.5" transform="rotate(28 50 42)"/>
      <circle cx="32" cy="22" r="17" fill="#f4efff" stroke="#5a1f8f" stroke-width="1.5"/>
      <ellipse cx="32" cy="23" rx="12.5" ry="10.5" fill="url(#vg)"/>
      <path d="M24 18q4-5 10-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>

    </svg>
    <div id="bubble"></div>
  </div>

  <div id="pop" role="dialog" aria-live="polite"><button class="cl" id="popX" aria-label="Cerrar">×</button><div class="k" id="popK"></div><h3 id="popT"></h3><div class="b" id="popB"></div><div class="acts" id="popA"></div></div>

  <div id="mayaCard" class="off">
    <h4><span>Tzolk'in · rueda sagrada</span><button class="ib" id="mayaHide" style="height:24px;min-width:24px;padding:0 6px">–</button></h4>
    <canvas id="gear" width="580" height="400"></canvas>
    <div class="mdate" id="mayaTxt"></div>
    <div class="mrow">
      <button class="ib" id="mPrev">−1 día</button><button class="ib on" id="mPlay">Girar</button><button class="ib" id="mNext">+1 día</button><button class="ib" id="mToday">Hoy</button>
    </div>
  </div>

  <div class="ov" id="ecl">
    <canvas id="eclC"></canvas>
    <div class="ovtop"><div class="cap"><em id="eK">Simulación</em><h3 id="eT">Eclipse</h3><p id="eP"></p></div><button class="ib" id="eClose">Cerrar ✕</button></div>
    <div class="ovbar">
      <button class="ib on" id="ePlay">Pausa</button>
      <input type="range" id="eSl" min="0" max="1000" value="0" aria-label="Avance del eclipse">
      <button class="ib" id="eSolar">Solar</button><button class="ib" id="eLunar">Lunar</button>
    </div>
  </div>

  <div id="boot">
    <img class="mk" id="bootMark" alt="">
    <img class="bl" id="bootLogo" alt="Vórtice VR">
    <div class="by">Observatorio orbital · laboratorio interactivo</div>
    <div class="lines" id="bootLines"></div>
    <div class="pb"><i id="bootBar"></i></div>
  </div>
</div>

const DEG=Math.PI/180, EPS=23.4393, PREC=25772, J2000=Date.UTC(2000,0,1,12);
const mod=(a,b)=>((a%b)+b)%b;

function cdmx(d){const t=dToDate(d-0.25);return {y:t.getUTCFullYear(),m:t.getUTCMonth(),day:t.getUTCDate(),h:t.getUTCHours(),mi:t.getUTCMinutes()};}
function fmtDate(d){const c=cdmx(d);return `${String(c.day).padStart(2,'0')} ${MESES[c.m]} ${c.y<0?(-c.y+1)+' a.C.':c.y}`;}
function fmtTime(d){const c=cdmx(d);return `${String(c.h).padStart(2,'0')}:${String(c.mi).padStart(2,'0')}`;}
function yearLabel(y){y=Math.round(y);return y<=0?`${fmt(1-y)} a.C.`:`${fmt(y)} d.C.`;}
function dOf(y,m,day,h=12){const t=new Date(Date.UTC(2000,0,1));t.setUTCFullYear(y,m,day);t.setUTCHours(h);return (t.getTime()-J2000)/864e5;}

/* posición en coordenadas eclípticas J2000 → mundo 3D (Y = polo norte de la eclíptica) */
function ecl(lam,bet,r=1,v){v=v||new THREE.Vector3();const l=lam*DEG,b=bet*DEG;return v.set(r*Math.cos(b)*Math.cos(l),r*Math.sin(b),-r*Math.cos(b)*Math.sin(l));}
function eq2ecl(raH,dec){const a=raH*15*DEG,d=dec*DEG,e=EPS*DEG;const b=Math.asin(Math.sin(d)*Math.cos(e)-Math.cos(d)*Math.sin(e)*Math.sin(a));const l=Math.atan2(Math.sin(a)*Math.cos(e)+Math.tan(d)*Math.sin(e),Math.cos(a));return [mod(l/DEG,360),b/DEG];}
function ll(lat,lon,r=1,v){v=v||new THREE.Vector3();const a=lat*DEG,o=lon*DEG;return v.set(r*Math.cos(a)*Math.cos(o),r*Math.sin(a),-r*Math.cos(a)*Math.sin(o));}

function sunLon(d){const g=(357.528+0.9856003*d)*DEG;return mod(280.460+0.9856474*d+1.915*Math.sin(g)+0.020*Math.sin(2*g),360);}
function sunDistAU(d){const g=(357.528+0.9856003*d)*DEG;return 1.00014-0.01671*Math.cos(g)-0.00014*Math.cos(2*g);}
function moonEcl(d){const L=218.316+13.176396*d,M=(134.963+13.064993*d)*DEG,F=(93.272+13.229350*d)*DEG,Ms=(357.529+0.98560028*d)*DEG,D=(297.850+12.190749*d)*DEG;
  const lon=L+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+0.658*Math.sin(2*D)+0.214*Math.sin(2*M)-0.186*Math.sin(Ms)-0.114*Math.sin(2*F);
  const lat=5.128*Math.sin(F)+0.2806*Math.sin(M+F)+0.2777*Math.sin(M-F)+0.1732*Math.sin(2*D-F);
  const dist=385001-20905*Math.cos(M)-3699*Math.cos(2*D-M)-2956*Math.cos(2*D);
  return {lon:mod(lon,360),lat,dist};}

function dayLen(lat,dec){const x=-Math.tan(lat*DEG)*Math.tan(dec*DEG);if(x>=1)return 0;if(x<=-1)return 24;return 2*Math.acos(x)/DEG/15;}
function moonAge(d){const m=moonEcl(d);return mod(m.lon-sunLon(d),360);}  // elongación
function phaseName(e){const n=['Luna nueva','Creciente','Cuarto creciente','Gibosa creciente','Luna llena','Gibosa menguante','Cuarto menguante','Menguante'];return n[Math.floor(mod(e+22.5,360)/45)];}

/* busca la siguiente luna nueva (0) o llena (180) */
function nextSyzygy(d0,target){let f=d=>mod(moonAge(d)-target+180,360)-180;let d=d0+0.05,prev=f(d);
  for(let i=0;i<400;i++){const dn=d+0.1,v=f(dn);if(prev<0&&v>=0&&Math.abs(v-prev)<90){let a=d,b=dn;for(let k=0;k<30;k++){const m=(a+b)/2;if(f(m)<0)a=m;else b=m;}return (a+b)/2;}d=dn;prev=v;}return d;}
function findEclipse(d0,type){let d=d0;for(let i=0;i<40;i++){const s=nextSyzygy(d,type==='solar'?0:180);const lat=Math.abs(moonEcl(s).lat);if(type==='solar'?lat<1.45:lat<0.95)return {d:s,lat};d=s+1;}return null;}

function fbm(x,y,z,o=5){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f,z*f);n+=a;f*=2.03;a*=.5;}return s/n;}

const ATM_FS=`uniform vec3 sunDir;varying vec3 vNv;varying vec3 vNw;void main(){float i=pow(max(0.74-dot(vNv,vec3(0,0,1.)),0.),3.0);float l=smoothstep(-0.5,0.4,dot(-vNw,sunDir));gl_FragColor=vec4(vec3(0.3,0.55,1.0)*i*(0.15+1.1*l)*1.6,1.0);}`;
const MOON_FS=`uniform sampler2D tex;uniform vec3 sunDir,axOff,center;uniform float ecOn,R;varying vec2 vUv;varying vec3 vN;varying vec3 vW;
void main(){vec3 n=normalize(vN);float ndl=dot(n,sunDir);vec3 c=texture2D(tex,vUv).rgb;vec3 col=c*(0.018+1.1*max(ndl,0.));
if(ecOn>0.5){vec3 p=(vW-center)/R;vec3 q=axOff+(p-sunDir*dot(p,sunDir));float d=length(q);float um=1.0-smoothstep(2.5,2.78,d);float pen=1.0-smoothstep(2.7,4.7,d);
vec3 blood=c*mix(vec3(0.55,0.11,0.04),vec3(0.95,0.35,0.12),smoothstep(1.2,2.7,d))*(0.5+0.5*max(ndl,0.));col=mix(col,col*0.45,pen*(1.0-um));col=mix(col,blood,um);}
gl_FragColor=vec4(col,1.0);}`;
const PLAN_FS=`uniform sampler2D tex;uniform vec3 sunPos;uniform float emissive;varying vec2 vUv;varying vec3 vN;varying vec3 vW;void main(){vec3 n=normalize(vN);vec3 L=normalize(sunPos-vW);float ndl=dot(n,L);vec3 c=texture2D(tex,vUv).rgb;vec3 V=normalize(cameraPosition-vW);float fr=pow(1.0-max(dot(n,V),0.),2.5);gl_FragColor=vec4(c*(0.035+1.1*max(ndl,0.))+c*fr*0.25*smoothstep(-0.3,0.3,ndl)+c*emissive,1.0);}`;
const SUN_FS=`uniform float t;varying vec3 vP;varying vec3 vN;varying vec3 vW;
float hs(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float ns(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(hs(i),hs(i+vec3(1,0,0)),f.x),mix(hs(i+vec3(0,1,0)),hs(i+vec3(1,1,0)),f.x),f.y),mix(mix(hs(i+vec3(0,0,1)),hs(i+vec3(1,0,1)),f.x),mix(hs(i+vec3(0,1,1)),hs(i+vec3(1,1,1)),f.x),f.y),f.z);}

vec3 c=mix(vec3(1.,.42,.06),vec3(1.,.93,.6),smoothstep(.25,.8,n));c+=vec3(.3,.15,0.)*smoothstep(.7,.9,g);
float mu=max(dot(normalize(vN),normalize(cameraPosition-vW)),0.);c*=.45+.6*pow(mu,.45);gl_FragColor=vec4(c*1.15,1.);}`;
const SUN_VS=`varying vec3 vP;varying vec3 vN;varying vec3 vW;void main(){vP=position;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const STAR_VS=`attribute float size;attribute vec3 color;attribute float ph;uniform float t,pr;varying vec3 vC;varying float vA;void main(){vC=color;float tw=0.7+0.3*sin(t*(0.8+ph*2.5)+ph*40.);vA=tw;gl_PointSize=size*pr*(0.85+0.3*tw);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const STAR_FS=`uniform float op;varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);float a=smoothstep(.5,0.,d);a*=a;gl_FragColor=vec4(vC,a*vA*op);}`;
/* ================= escena ================= */
let renderer,scene,camera,controls;
const U={t:{value:0}};
const G={};           // grupos por módulo
const O={};           // objetos importantes
const SKY_R=5200;

function sprite(tex,size,op=1,color){const m=new THREE.SpriteMaterial({map:tex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op,color:color||0xffffff});const s=new THREE.Sprite(m);s.scale.set(size,size,1);return s;}
function lineFrom(pts,color,op=1,dashed){const g=new THREE.BufferGeometry().setFromPoints(pts);const m=dashed?new THREE.LineDashedMaterial({color,transparent:true,opacity:op,dashSize:dashed[0],gapSize:dashed[1],depthWrite:false}):new THREE.LineBasicMaterial({color,transparent:true,opacity:op,depthWrite:false});const l=new THREE.Line(g,m);if(dashed)l.computeLineDistances();return l;}
function circlePts(r,n=256,fn){const a=[];for(let i=0;i<=n;i++){const t=i/n*Math.PI*2;a.push(fn?fn(t):new THREE.Vector3(Math.cos(t)*r,0,-Math.sin(t)*r));}return a;}

function makeSun(r){const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),new THREE.ShaderMaterial({uniforms:{t:U.t},vertexShader:SUN_VS,fragmentShader:SUN_FS}));g.add(m);
  const rays=sprite(TX.rays,r*9,.55);g.add(rays);const gl=sprite(TX.glow,r*6,1);g.add(gl);const gl2=sprite(TX.glow,r*16,.28);g.add(gl2);
  g.userData={mesh:m,rays,gl,gl2,r};return g;}
function makeEarth(R){
  const frame=new THREE.Group(),spin=new THREE.Group();frame.add(spin);
  const sunDir={value:new THREE.Vector3(1,0,0)};
  const mat=new THREE.ShaderMaterial({uniforms:{day:{value:TX.day},night:{value:TX.night},mask:{value:TX.mask},sunDir,shOff:{value:new THREE.Vector3()},center:{value:new THREE.Vector3()},shOn:{value:0},lights:{value:1},R:{value:R}},vertexShader:VS,fragmentShader:EARTH_FS});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(R,96,64),mat);spin.add(mesh);
  const cmat=new THREE.ShaderMaterial({uniforms:{tex:{value:TX.clouds},sunDir,op:{value:1}},vertexShader:VS,fragmentShader:CLOUD_FS,transparent:true,depthWrite:false});
  const clouds=new THREE.Mesh(new THREE.SphereGeometry(R*1.012,96,64),cmat);spin.add(clouds);
  const atm=new THREE.Mesh(new THREE.SphereGeometry(R*1.07,64,48),new THREE.ShaderMaterial({uniforms:{sunDir},vertexShader:ATM_VS,fragmentShader:ATM_FS,side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));frame.add(atm);
  const axis=new THREE.Group();axis.add(lineFrom([new THREE.Vector3(0,-R*1.7,0),new THREE.Vector3(0,R*1.7,0)],0xd2b8ff,.9));
  const cone=new THREE.Mesh(new THREE.ConeGeometry(R*.06,R*.18,16),new THREE.MeshBasicMaterial({color:0xffbe55}));cone.position.y=R*1.75;axis.add(cone);frame.add(axis);
  const lat=new THREE.Group();
  [[0,0xd2b8ff,.75,null],[23.44,0xffbe55,.7,[R*.05,R*.04]],[-23.44,0xffbe55,.7,[R*.05,R*.04]],[66.56,0x74e8ba,.6,[R*.03,R*.03]],[-66.56,0x74e8ba,.6,[R*.03,R*.03]]].forEach(([la,c,o,ds])=>{const r=R*1.006*Math.cos(la*DEG),y=R*1.006*Math.sin(la*DEG);lat.add(lineFrom(circlePts(r,160,t=>new THREE.Vector3(Math.cos(t)*r,y,Math.sin(t)*r)),c,o,ds));});
  frame.add(lat);
  const pins=new THREE.Group();spin.add(pins);
  const E={frame,spin,mesh,clouds,atm,axis,lat,pins,mat,cmat,sunDir,R,
    setOrient(P,V){const Z=new THREE.Vector3().crossVectors(V,P);frame.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V,P,Z));},
    surf(la,lo,h=1){return spin.localToWorld(ll(la,lo,R*h));},
    addPin(la,lo,color=0xffbe55){const s=sprite(TX.spot,R*.14,1,color);ll(la,lo,R*1.02,s.position);pins.add(s);return s;}};
  return E;}
function makeMoon(R){const u={tex:{value:TX.moon},sunDir:{value:new THREE.Vector3(1,0,0)},axOff:{value:new THREE.Vector3()},center:{value:new THREE.Vector3()},ecOn:{value:0},R:{value:R}};
  const m=new THREE.Mesh(new THREE.SphereGeometry(R,64,48),new THREE.ShaderMaterial({uniforms:u,vertexShader:VS,fragmentShader:MOON_FS}));m.userData.u=u;return m;}
function makePlanet(p,R){const g=new THREE.Group();const tilt=new THREE.Group();tilt.rotation.z=-p.tilt*DEG;g.add(tilt);
  const u={tex:{value:TX.pl[p.id]},sunPos:{value:new THREE.Vector3()},emissive:{value:0}};
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(R,64,48),new THREE.ShaderMaterial({uniforms:u,vertexShader:VS,fragmentShader:PLAN_FS}));tilt.add(mesh);
  if(p.id==='saturno'){const rg=new THREE.RingGeometry(R*1.25,R*2.3,128,1);const pos=rg.attributes.position,uv=rg.attributes.uv;const v=new THREE.Vector3();for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);uv.setXY(i,(v.length()-R*1.25)/(R*1.05),.5);}
    const rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:TX.ring,transparent:true,side:THREE.DoubleSide,depthWrite:false,opacity:.95}));rm.rotation.x=-Math.PI/2;tilt.add(rm);}
  if(p.id==='urano'){const rg=new THREE.RingGeometry(R*1.5,R*1.56,96);const rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x99bbcc,transparent:true,opacity:.35,side:THREE.DoubleSide}));rm.rotation.x=-Math.PI/2;tilt.add(rm);}
  g.userData={mesh,tilt,u,R,spin:rnd()*6};return g;}

/* ---------- cielo: estrellas, Vía Láctea, constelaciones ---------- */
function buildSky(){
  const sky=new THREE.Group();G.sky=sky;scene.add(sky);
  const N=7000,M=11000,pos=new Float32Array((N+M)*3),col=new Float32Array((N+M)*3),sz=new Float32Array(N+M),ph=new Float32Array(N+M);
  const v=new THREE.Vector3();
  const gpE=eq2ecl(12.857,27.13),gcE=eq2ecl(17.761,-29.0);const gp=ecl(gpE[0],gpE[1]),gc=ecl(gcE[0],gcE[1]);gc.sub(gp.clone().multiplyScalar(gc.dot(gp))).normalize();const g3=new THREE.Vector3().crossVectors(gp,gc);
  const pal=[[.75,.82,1],[1,1,1],[1,.95,.85],[1,.85,.65],[1,.75,.6],[.9,.85,1]];
  for(let i=0;i<N+M;i++){
    if(i<N){const z=rnd()*2-1,t=rnd()*Math.PI*2,r=Math.sqrt(1-z*z);v.set(r*Math.cos(t),z,r*Math.sin(t));const c=pal[Math.floor(rnd()*pal.length)];const b=0.45+rnd()*0.55;col.set([c[0]*b,c[1]*b,c[2]*b],i*3);sz[i]=0.8+Math.pow(rnd(),6)*3.2;}
    else{const gauss=()=>(rnd()+rnd()+rnd()-1.5)*1.4;let l=rnd()<.55?gauss()*55*DEG:rnd()*Math.PI*2;const b=gauss()*(5+6*Math.pow(Math.cos(l/2),2))*DEG;
      v.copy(gc).multiplyScalar(Math.cos(b)*Math.cos(l)).addScaledVector(g3,Math.cos(b)*Math.sin(l)).addScaledVector(gp,Math.sin(b));const k=0.12+rnd()*0.2+0.15*Math.pow(Math.cos(l/2),4);col.set([k*.85,k*.78,k*1.05],i*3);sz[i]=1+rnd()*1.8;}
    v.multiplyScalar(SKY_R+200);pos.set([v.x,v.y,v.z],i*3);ph[i]=rnd();}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.setAttribute('size',new THREE.BufferAttribute(sz,1));geo.setAttribute('ph',new THREE.BufferAttribute(ph,1));
  const pr={value:Math.min(devicePixelRatio,2)};O.starMat=new THREE.ShaderMaterial({uniforms:{t:U.t,pr,op:{value:1}},vertexShader:STAR_VS,fragmentShader:STAR_FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  sky.add(new THREE.Points(geo,O.starMat));
  // constelaciones
  O.cons={};const cg=new THREE.Group();sky.add(cg);G.cons=cg;
  const spos=[],scol=[],ssz=[],sph=[];
  CONS.forEach(c=>{const pts=c.s.map(s=>{const e=eq2ecl(s[0],s[1]);return ecl(e[0],e[1],SKY_R);});
    c.s.forEach((s,i)=>{spos.push(pts[i].x,pts[i].y,pts[i].z);const b=s[2]===1?1:s[2]===2?.8:.62;scol.push(b,b*.95,b);ssz.push(s[2]===1?5.2:s[2]===2?3.8:2.8);sph.push(rnd());});
    const lp=[];c.l.forEach(([a,b])=>{lp.push(pts[a],pts[b]);});
    const lm=new THREE.LineBasicMaterial({color:c.extra?0x74e8ba:0xb48cff,transparent:true,opacity:.42,depthWrite:false});const ls=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lp),lm);cg.add(ls);
    const cen=new THREE.Vector3();pts.forEach(p=>cen.add(p));cen.normalize();
    O.cons[c.id]={c,lines:ls,mat:lm,center:cen};});
  BRIGHT.forEach(b=>{const e=eq2ecl(b[0],b[1]);const p=ecl(e[0],e[1],SKY_R);spos.push(p.x,p.y,p.z);scol.push(1,.97,.92);ssz.push(4.6);sph.push(rnd());});
  {const o=CONS.find(c=>c.id==='ori');const h=new THREE.Vector3();[1,3,4].forEach(i=>{const e=eq2ecl(o.s[i][0],o.s[i][1]);h.add(ecl(e[0],e[1]));});O.hearth=h.normalize().multiplyScalar(SKY_R*.97);}
  // Pléyades
  O.pleiades=(()=>{const e=eq2ecl(3.79,24.11);return ecl(e[0],e[1],SKY_R);})();
  for(let i=0;i<7;i++){const e=eq2ecl(3.79+(rnd()-.5)*.09,24.11+(rnd()-.5)*1.2);const p=ecl(e[0],e[1],SKY_R);spos.push(p.x,p.y,p.z);scol.push(.8,.87,1);ssz.push(2.6);sph.push(rnd());}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(spos,3));sg.setAttribute('color',new THREE.Float32BufferAttribute(scol,3));sg.setAttribute('size',new THREE.Float32BufferAttribute(ssz,1));sg.setAttribute('ph',new THREE.Float32BufferAttribute(sph,1));
  O.cstarMat=new THREE.ShaderMaterial({uniforms:{t:U.t,pr,op:{value:1}},vertexShader:STAR_VS,fragmentShader:STAR_FS,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  sky.add(new THREE.Points(sg,O.cstarMat));
  O.bright={};BRIGHT.forEach(b=>{const e=eq2ecl(b[0],b[1]);O.bright[b[2]]=ecl(e[0],e[1],SKY_R);});
  // eclíptica en el cielo
  O.skyEcl=lineFrom(circlePts(SKY_R-30,360),0xffbe55,.25,[40,30]);sky.add(O.skyEcl);
  // banda zodiacal (fronteras IAU) y anillo de signos tropicales
  const zb=new THREE.Group();sky.add(zb);G.zband=zb;O.zseg={};
  SEG.forEach((s,i)=>{const nx=SEG[(i+1)%SEG.length];let a=s.start,b=nx.start;if(b<a)b+=360;const n=Math.max(4,Math.ceil(b-a));const P=[],idx=[];
    for(let k=0;k<=n;k++){const l=a+(b-a)*k/n;P.push(...ecl(l,-9,SKY_R-60).toArray(),...ecl(l,9,SKY_R-60).toArray());if(k<n){const q=k*2;idx.push(q,q+1,q+2,q+1,q+3,q+2);}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setIndex(idx);
    const m=new THREE.MeshBasicMaterial({color:i%2?0x6b2fb0:0x4a1f80,transparent:true,opacity:.1,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});zb.add(new THREE.Mesh(g,m));
    zb.add(lineFrom([ecl(a,-9,SKY_R-55),ecl(a,9,SKY_R-55)],0xd2b8ff,.35));
    O.zseg[s.id]={m,mid:mod(a+(b-a)/2,360)};});
  const sr=new THREE.Group();sky.add(sr);G.signs=sr;
  for(let k=0;k<12;k++){sr.add(lineFrom([ecl(k*30,-11,SKY_R-70),ecl(k*30,-15,SKY_R-70)],0x74e8ba,.8));}
  sr.add(lineFrom(circlePts(0,360,t=>ecl(t/DEG,-13,SKY_R-70)),0x74e8ba,.35));
  // círculo de precesión del polo
  O.poleCircle=lineFrom(circlePts(0,360,t=>ecl(t/DEG,90-EPS,SKY_R-40)),0xffbe55,.55,[30,24]);sky.add(O.poleCircle);
  O.poleMark=sprite(TX.spot,180,1,0xffbe55);sky.add(O.poleMark);
  O.vernalMark=sprite(TX.spot,260,1,0xffd27f);sky.add(O.vernalMark);
  O.skySun=sprite(TX.glow,700,.9);sky.add(O.skySun);
}

/* ---------- módulo: Sistema solar ---------- */
const distD=a=>38+64*Math.sqrt(a);
const radD=r=>1.15*Math.pow(r/1000,.55);
function buildSolar(){const g=new THREE.Group();G.solar=g;scene.add(g);
  O.sSun=makeSun(16);g.add(O.sSun);O.sSun.userData.mesh.userData.pick='sol';
  O.sPl={};
  PL.forEach(p=>{const R=radD(p.r);let obj;
    if(p.id==='tierra'){const E=makeEarth(R);O.sEarth=E;obj=new THREE.Group();obj.add(E.frame);E.axis.visible=false;E.lat.visible=false;obj.userData={R,mesh:E.mesh};}
    else{obj=makePlanet(p,R);}
    g.add(obj);O.sPl[p.id]=obj;
    const hit=new THREE.Mesh(new THREE.SphereGeometry(Math.max(R*1.8,5),12,8),new THREE.MeshBasicMaterial({visible:false}));hit.userData.pick=p.id;obj.add(hit);
    const orb=lineFrom(circlePts(distD(p.a),256),0xb48cff,.22);g.add(orb);obj.userData.orbit=orb;});
  O.sMoon=makeMoon(radD(1737)*1.1);g.add(O.sMoon);
  const hm=new THREE.Mesh(new THREE.SphereGeometry(3,8,6),new THREE.MeshBasicMaterial({visible:false}));hm.userData.pick='luna';O.sMoon.add(hm);
  // cinturón de asteroides
  const n=3000,ap=new Float32Array(n*3);for(let i=0;i<n;i++){const a=2.1+rnd()*1.25,t=rnd()*Math.PI*2,r=distD(a);ap.set([Math.cos(t)*r,(rnd()-.5)*4,Math.sin(t)*r],i*3);}
  const ag=new THREE.BufferGeometry();ag.setAttribute('position',new THREE.BufferAttribute(ap,3));
  O.belt=new THREE.Points(ag,new THREE.PointsMaterial({color:0xb7a48f,size:1.1,sizeAttenuation:true,transparent:true,opacity:.7,depthWrite:false}));g.add(O.belt);
  O.sLight=new THREE.PointLight(0xfff1dd,1.4,0,0);g.add(O.sLight);
}

function buildMoonMode(){const g=new THREE.Group();G.moon=g;scene.add(g);

const PANEL={};
PANEL.solar=()=>`<div class="kick">Módulo 01 · Vista general</div><h2>Nuestro sistema solar</h2>
<p class="lead">El Sol concentra el <b>99.86 %</b> de toda la masa del sistema. Los ocho planetas giran en el mismo sentido y casi en el mismo plano, la <b>eclíptica</b>, porque nacieron del mismo disco de gas y polvo hace unos 4,600 millones de años.</p>
<div class="chips" id="plChips">${['sol',...PL.map(p=>p.id),'luna'].map(id=>`<button class="chip" data-focus="${id}">${FICHA[id].n}</button>`).join('')}</div>
<p class="note">Toca un planeta o un botón para volar hacia él y abrir su ficha técnica. Las distancias y los tamaños están comprimidos para que todo quepa en pantalla.</p>
<details class="sec" open><summary>La escala real<i>01</i></summary><div><p>Si la Tierra fuera un grano de pimienta de 1 mm, el Sol sería una pelota de 11 cm a <b>12 metros</b> de distancia, y Neptuno estaría a <b>350 metros</b>. Casi todo el sistema solar es espacio vacío.</p><p>La luz del Sol tarda <b>8 min 20 s</b> en llegar a la Tierra y unas <b>4 horas</b> en llegar a Neptuno.</p></div></details>
<details class="sec"><summary>Las tres leyes de Kepler<i>02</i></summary><div><p><b>1. Órbitas elípticas.</b> Cada planeta recorre una elipse y el Sol está en uno de sus focos. La órbita de la Tierra es casi circular: su distancia varía entre 147.1 y 152.1 millones de km.</p><p><b>2. Áreas iguales.</b> Un planeta va más rápido cuando está cerca del Sol. Por eso el invierno del hemisferio norte dura unos 5 días menos que el verano.</p><p><b>3. Periodo y distancia.</b> El cuadrado del año es proporcional al cubo de la distancia. Mercurio da la vuelta en 88 días; Neptuno tarda casi 165 años.</p></div></details>
<details class="sec"><summary>¿Por qué todo gira?<i>03</i></summary><div><p>La nube que formó al Sol ya giraba lentamente. Al contraerse por su propia gravedad giró más rápido, como una patinadora que encoge los brazos, y se aplanó en un disco. De ese disco salieron los planetas, y por eso todos orbitan en el mismo sentido.</p></div></details>`;

PANEL.earth=()=>`<div class="kick">Módulo 02 · Rotación</div><h2>El día y la noche</h2>
<p class="lead">La Tierra gira sobre su eje de oeste a este. La mitad que mira al Sol vive el día; la otra mitad, la noche. La línea que las separa se llama <b>terminador</b>.</p>
<div class="readout"><div class="wide hi"><em>Villahermosa ahora (simulado)</em><strong id="lvVh">—</strong></div><div><em>Altura del Sol</em><strong id="lvAlt">—</strong></div><div><em>Hora CDMX</em><strong id="lvHr">—</strong></div><div class="wide"><em>El Sol está en el cenit sobre</em><strong id="lvSub">—</strong></div></div>
<p class="note">Mueve el control de la hora o toca ▶ para ver cómo el terminador barre el planeta. Las luces de las ciudades aparecen del lado nocturno.</p>
<details class="sec" open><summary>Día solar y día sidéreo<i>01</i></summary><div><p>La Tierra da una vuelta completa respecto a las estrellas en <b>23 h 56 min 4 s</b> (día sidéreo). Pero mientras gira, también avanza cerca de 1° en su órbita, así que necesita unos 4 minutos más para que el Sol vuelva al mismo punto del cielo: así se forma el <b>día solar de 24 horas</b>.</p></div></details>
<details class="sec"><summary>¿Qué tan rápido giramos?<i>02</i></summary><div><p>En el ecuador la superficie se mueve a <b>1,670 km/h</b>. En Villahermosa, a 18° de latitud norte, a unos <b>1,590 km/h</b>. En los polos, casi nada.</p><p>Esa rotación achata al planeta: el radio ecuatorial mide 6,378 km y el polar 6,357 km. También desvía vientos y huracanes (efecto Coriolis): en el norte giran en sentido antihorario.</p></div></details>
<details class="sec"><summary>El Sol no “sale”<i>03</i></summary><div><p>El Sol parece salir por el este porque nosotros giramos hacia él. El amanecer es tu punto de la Tierra entrando al lado iluminado. La atmósfera dobla la luz, así que lo vemos unos minutos antes de que esté realmente sobre el horizonte.</p></div></details>
<details class="sec"><summary>Los días se alargan<i>04</i></summary><div><p>La marea que la Luna levanta frena poco a poco la rotación: el día se alarga cerca de <b>1.7 milisegundos por siglo</b>. Hace 400 millones de años, un año tenía unos 400 días.</p></div></details>`;

PANEL.seasons=()=>`<div class="kick">Módulo 03 · Traslación</div><h2>Las estaciones</h2>
<div class="readout"><div class="wide hi"><em>Fecha simulada</em><strong id="lvDate">—</strong></div><div><em>Hemisferio norte</em><strong id="lvN">—</strong></div><div><em>Hemisferio sur</em><strong id="lvS">—</strong></div><div><em>Declinación del Sol</em><strong id="lvDec">—</strong></div><div><em>Distancia al Sol</em><strong id="lvDist">—</strong></div><div><em>Luz · Villahermosa</em><strong id="lvL1">—</strong></div><div><em>Luz · Buenos Aires</em><strong id="lvL2">—</strong></div><div><em>Luz · Oslo</em><strong id="lvL3">—</strong></div><div><em>Luz · Polo Norte</em><strong id="lvL4">—</strong></div></div>
<p class="lead">Las estaciones <b>no</b> dependen de la distancia al Sol. La Tierra está más cerca a principios de enero, en pleno invierno del norte. Se deben a que el eje está inclinado <b>23.44°</b> y siempre apunta hacia la misma zona del cielo, cerca de Polaris.</p>
<details class="sec" open><summary>¿Por qué aquí es otoño y abajo primavera?<i>01</i></summary><div><p>Hacia el <b>22 de septiembre</b> el Sol cruza el ecuador hacia el sur (equinoccio). A partir de ahí el hemisferio norte se va inclinando <b>lejos</b> del Sol: los rayos llegan más oblicuos y los días se acortan. Es otoño.</p><p>El hemisferio sur, al mismo tiempo, se inclina <b>hacia</b> el Sol: rayos más directos, días más largos. Es primavera. Es la misma Tierra, en el mismo día, recibiendo la luz con ángulos opuestos.</p><p>Seis meses después, en el lado opuesto de la órbita, todo se invierte.</p></div></details>
<details class="sec"><summary>Dos efectos que se suman<i>02</i></summary><div><p><b>Ángulo.</b> Una linterna vertical concentra la luz en un círculo; inclinada, la reparte en un óvalo más grande y cada metro cuadrado recibe menos energía.</p><p><b>Duración.</b> En verano el Sol pasa más horas sobre el horizonte y calienta durante más tiempo.</p></div></details>
<details class="sec"><summary>Equinoccios y solsticios 2026<i>03</i></summary><div><p><b>20 mar</b> · equinoccio: día y noche casi iguales en todo el planeta.<br><b>21 jun</b> · solsticio: el Sol llega al trópico de Cáncer. Día más largo del norte.<br><b>22 sep</b> · equinoccio de otoño (norte) y primavera (sur).<br><b>21 dic</b> · solsticio: el Sol llega al trópico de Capricornio.</p><p class="note">Fechas en hora del centro de México.</p></div></details>
<details class="sec"><summary>Villahermosa está en el trópico<i>04</i></summary><div><p>Como Villahermosa está a 18° N, dentro de la zona tropical, el Sol pasa exactamente por el cenit dos veces al año. Esos días, al mediodía, los objetos casi no proyectan sombra.</p><p><b id="lvZen">—</b></p><p>Por eso aquí las estaciones se sienten más como <b>lluvias y secas</b> que como verano e invierno: la duración del día sólo varía entre ~11 h 5 min y ~13 h 10 min.</p></div></details>`;

PANEL.moon=()=>`<div class="kick">Módulo 04 · La Luna</div><h2>Fases, mareas y eclipses</h2>
<div class="readout"><div class="wide hi"><em>Fase</em><strong id="lvPh">—</strong></div><div><em>Iluminada</em><strong id="lvIll">—</strong></div><div><em>Edad lunar</em><strong id="lvAge">—</strong></div><div><em>Distancia</em><strong id="lvMd">—</strong></div><div><em>Altura sobre la eclíptica</em><strong id="lvLat">—</strong></div><div class="wide"><em>Alineación para eclipse</em><strong id="lvEc">—</strong></div></div>
<button class="cta" data-eclipse="solar">▶ Vivir un eclipse solar total</button>
<button class="cta blood" data-eclipse="lunar">▶ Vivir un eclipse lunar · Luna de sangre</button>
<button class="cta alt" id="findSolar">Saltar al próximo eclipse solar</button>
<button class="cta alt" id="findLunar">Saltar al próximo eclipse lunar</button>
<p class="note" id="findOut">Cálculo aproximado con un modelo simplificado de la órbita lunar.</p>
<details class="sec" open><summary>¿Por qué no hay eclipse cada mes?<i>01</i></summary><div><p>La órbita de la Luna está inclinada <b>5.1°</b> respecto a la eclíptica (el disco dorado). Casi siempre la Luna nueva pasa por arriba o por abajo del Sol. Sólo hay eclipse cuando la Luna nueva o llena coincide cerca de un <b>nodo</b>, los dos puntos verdes donde su órbita cruza la eclíptica.</p><p>Eso ocurre en <b>temporadas de eclipses</b>, cada 173 días aproximadamente.</p></div></details>
<details class="sec"><summary>La coincidencia perfecta<i>02</i></summary><div><p>El Sol es unas <b>400 veces más grande</b> que la Luna y está unas <b>400 veces más lejos</b>. Por eso en el cielo miden casi lo mismo, y la Luna puede tapar exactamente el disco solar dejando ver la corona. Cuando la Luna está en su punto más lejano no alcanza a cubrirlo: el eclipse es <b>anular</b>, un anillo de fuego.</p></div></details>
<details class="sec"><summary>La Luna de sangre<i>03</i></summary><div><p>En un eclipse lunar total la Luna no desaparece: se vuelve rojiza. La atmósfera de la Tierra dobla la luz del Sol hacia la sombra y filtra el azul. Lo que ilumina a la Luna es la luz de <b>todos los amaneceres y atardeceres del planeta</b> al mismo tiempo.</p></div></details>
<details class="sec"><summary>Gravedad, mareas y baricentro<i>04</i></summary><div><p>La Luna atrae más al océano del lado cercano que al centro de la Tierra, y al centro más que al lado lejano. Se forman dos abultamientos, por eso hay dos mareas altas al día. El Sol aporta casi la mitad de ese efecto: en luna nueva y llena se suman (mareas vivas).</p><p>La Tierra y la Luna giran alrededor de un centro de masa común, el <b>baricentro</b> (punto rosa), a 4,670 km del centro terrestre: dentro de la Tierra, a unos 1,700 km bajo la superficie.</p></div></details>
<details class="sec"><summary>Mes sidéreo y mes sinódico<i>05</i></summary><div><p>La Luna da una vuelta respecto a las estrellas en <b>27.32 días</b>. Pero como la Tierra avanza alrededor del Sol, necesita <b>29.53 días</b> para volver a la misma fase. Gira sobre sí misma en el mismo tiempo que tarda en orbitarnos, por eso siempre vemos la misma cara.</p></div></details>
<details class="sec"><summary>Eclipses para agendar<i>06</i></summary><div><p><b>2 ago 2027</b> · solar total: sur de España, norte de África y Egipto, con más de 6 minutos de totalidad en Luxor.<br><b>8 abr 2024</b> · el último total que cruzó México (Mazatlán, Durango, Torreón).<br>Los eclipses se repiten cada <b>Saros</b>: 18 años, 11 días y 8 horas. El de 2024 volverá el 20 de abril de 2042.</p></div></details>`;

PANEL.prec=()=>`<div class="kick">Módulo 05 · Precesión</div><h2>Las eras zodiacales</h2>
<div class="readout"><div class="wide hi"><em>Año simulado</em><strong id="lvYear">—</strong></div><div class="wide"><em>El Sol del equinoccio de marzo está en</em><strong id="lvEra">—</strong></div><div><em>Siguiente era</em><strong id="lvNext">—</strong></div><div><em>Estrella polar</em><strong id="lvPole">—</strong></div></div>
<p class="lead">El eje de la Tierra cabecea como un trompo y dibuja un cono completo cada <b>25,772 años</b>. Al moverse, el punto donde está el Sol en el equinoccio de marzo, el <b>punto vernal</b> (rayo dorado), retrocede por las constelaciones del zodiaco. Cada constelación que atraviesa da nombre a una <b>era</b>.</p>
<details class="sec" open><summary>¿En qué era estamos?<i>01</i></summary><div><p>Hoy el punto vernal está en <b>Piscis</b>, cerca de su frontera con Acuario. Con las fronteras oficiales de la Unión Astronómica Internacional, entrará en <b>Acuario hacia el año 2600</b>.</p><p>La astrología no tiene una fecha única: según el sistema, la “Era de Acuario” empieza en el siglo XX, en el XXI o después de 2600. Astronómicamente vivimos <b>el final de la Era de Piscis</b>, en transición hacia Acuario.</p></div></details>
<details class="sec" open><summary>Línea de las eras<i>02</i></summary><div><p class="note">Toca una era para viajar a ese año. Las fechas usan las fronteras reales de las constelaciones, que no miden lo mismo; la tradición las redondea a 2,160 años cada una.</p><div class="timeline" id="eraList"></div></div></details>
<details class="sec"><summary>¿Por qué ocurre?<i>03</i></summary><div><p>La Tierra no es una esfera perfecta: es más ancha en el ecuador. El Sol y la Luna tiran de ese abultamiento intentando “enderezar” el eje. Como la Tierra gira, responde igual que un trompo: su eje describe un círculo lento. Retrocede <b>1° cada 71.6 años</b>.</p><p>La descubrió el astrónomo griego <b>Hiparco</b> hacia el año 130 a.C., comparando sus mediciones con registros de siglos anteriores.</p></div></details>
<details class="sec"><summary>La Biblia y las eras<i>04</i></summary><div><p class="note">Estas son lecturas simbólicas que hacen algunos autores y tradiciones esotéricas; el texto bíblico no habla de eras astrológicas.</p>
<p><b>Tauro (≈ 4,400 – 1,800 a.C.)</b> · Era del toro: Apis en Egipto, el toro de Creta. El <b>becerro de oro</b> (Éxodo 32) se interpreta como el apego a la era que terminaba.</p>
<p><b>Aries (≈ 1,800 a.C. – inicio de nuestra era)</b> · El carnero: Abraham sacrifica un <b>carnero</b> en lugar de Isaac (Génesis 22:13); el shofar se hace de cuerno de carnero; el cordero pascual (Éxodo 12).</p>
<p><b>Piscis (≈ inicio de nuestra era – 2600)</b> · El pez: el <b>ichthys</b> fue el símbolo de los primeros cristianos; los apóstoles eran pescadores y Jesús les dice que serán “pescadores de hombres” (Mateo 4:19); la multiplicación de panes y peces.</p>
<p><b>Acuario</b> · En Lucas 22:10 Jesús indica a sus discípulos que sigan a “un hombre que lleva un cántaro de agua”. Algunos lo leen como anuncio de la era del aguador.</p>
<div class="q">“Haya lumbreras en la expansión de los cielos… y sirvan de señales para las estaciones, para días y años.”<cite>Génesis 1:14</cite></div>
<p>En <b>Job 38:31-32</b> se mencionan las Pléyades, Orión y <i>Mazzaroth</i>, palabra hebrea que muchos traducen como “las constelaciones” o “el zodiaco”.</p>
<p>Los <b>cuatro seres vivientes</b> de Ezequiel 1:10 y Apocalipsis 4:7 (león, toro, hombre y águila) se han relacionado con los cuatro signos fijos: Leo, Tauro, Acuario y Escorpio, cuyo símbolo antiguo era un águila. Filón y Flavio Josefo vincularon las <b>12 piedras</b> del pectoral del sumo sacerdote, y las 12 tribus, con los 12 signos.</p></div></details>
<details class="sec"><summary>Signos vs. constelaciones<i>05</i></summary><div><p>Los <b>signos</b> (anillo verde) son 12 sectores iguales de 30° que empiezan en el punto vernal: se mueven con la precesión. Las <b>constelaciones</b> (banda morada) son grupos de estrellas fijos y de tamaños desiguales. Hace 2,000 años coincidían; hoy están desfasados casi un signo completo.</p>
<div class="tool"><label for="bday">Tu fecha de nacimiento</label><input type="date" id="bday" value="1990-06-15"><div class="out" id="bdayOut"></div></div>
<p><b>Ofiuco</b>, la constelación número 13, también cruza la eclíptica: el Sol pasa por ella del 30 de noviembre al 17 de diciembre, aunque la astrología tradicional no la usa.</p></div></details>
<details class="sec"><summary>Las estrellas polares<i>06</i></summary><div><p>El eje apunta hoy a <b>Polaris</b>, que estará en su punto más cercano al polo hacia el año 2100. Cuando se construyeron las pirámides de Egipto la estrella polar era <b>Thuban</b>, en Draco. Hacia el año <b>14,000</b> lo será <b>Vega</b>, una de las estrellas más brillantes del cielo.</p></div></details>`;

PANEL.trazos=()=>`<div class="kick">Módulo 06 · Gravedad</div><h2>Trazos y gravedad</h2>
<p class="lead">La gravedad del Sol curva el camino de cada planeta. Sus ritmos se combinan y, si unes sus posiciones con líneas, aparecen figuras geométricas asombrosas.</p>
<div class="chips" id="trChips">${Object.entries(TRP).map(([k,v])=>`<button class="chip${S.tr.pair===k?' on':''}" data-pair="${k}">${v.n}</button>`).join('')}</div>
<p id="trDesc">${TRP[S.tr.pair].d}</p>
<div class="readout"><div><em>Tiempo trazado</em><strong id="lvTrY">—</strong></div><div><em>Segmentos</em><strong id="lvTrN">—</strong></div></div>
<button class="cta alt" id="trClear">Borrar y empezar de nuevo</button>
<details class="sec" open><summary>La Rosa de Venus<i>01</i></summary><div><p>Cada <b>584 días</b> Venus queda entre la Tierra y el Sol. Cinco de esos encuentros suman <b>2,920 días = 8 años terrestres</b>, casi exactamente 13 vueltas de Venus. Los cinco puntos de encuentro forman un <b>pentagrama</b> en el cielo.</p><p>Los mayas registraron este ciclo en el <b>Códice de Dresde</b>: 5 × 584 = 8 × 365. Venus era Kukulkán, la serpiente emplumada.</p></div></details>
<details class="sec"><summary>La ley de la gravedad<i>02</i></summary><div><div class="q" style="font-style:normal;font-family:var(--fm)">F = G · m₁ · m₂ / r²</div><p>Toda masa atrae a toda masa. La fuerza crece con las masas y cae con el cuadrado de la distancia: al doble de distancia, la cuarta parte de fuerza. Newton se dio cuenta de que la misma fuerza que hace caer una manzana mantiene a la Luna en órbita.</p><p>Einstein lo explicó de otro modo: la masa <b>curva el espacio-tiempo</b> y los planetas siguen la línea más recta posible en ese espacio curvo.</p></div></details>
<details class="sec"><summary>Tu peso en otros mundos<i>03</i></summary><div><div class="tool"><label for="kg">Tu peso en la Tierra (kg)</label><input type="number" id="kg" value="70" min="1" max="400" inputmode="decimal"><div class="wt" id="wtOut"></div></div><p class="note">Tu masa no cambia; cambia la fuerza con la que cada mundo te atrae.</p></div></details>
<details class="sec"><summary>Nadie gira alrededor de un punto fijo<i>04</i></summary><div><p>El Sol y Júpiter giran alrededor de un centro de masa común que queda <b>justo fuera de la superficie del Sol</b>. Por eso el Sol se tambalea un poco. Los astrónomos usan ese mismo tambaleo en otras estrellas para descubrir planetas.</p></div></details>`;

PANEL.cult=()=>`<div class="kick">Módulo 07 · Cielos de México</div><h2>Mayas y mexicas</h2>
<p class="lead">Sin telescopios, los pueblos de Mesoamérica midieron el año, la Luna, Venus y los eclipses con una precisión que asombra hasta hoy. Toca los puntos del mapa para visitar sus observatorios.</p>
<div class="readout"><div class="wide hi"><em>Hoy en la Cuenta Larga maya</em><strong id="lvLC">—</strong></div><div><em>Tzolk'in</em><strong id="lvTz">—</strong></div><div><em>Haab'</em><strong id="lvHb">—</strong></div><div class="wide"><em>Tonalpohualli mexica</em><strong id="lvTn">—</strong></div></div>
<button class="cta" id="showGear">Abrir la rueda del Tzolk'in</button>
<div class="tool"><label for="nawal">Descubre tu día maya · fecha de nacimiento</label><input type="date" id="nawal" value="1990-06-15"><div class="out" id="nawalOut"></div></div>
<details class="sec" open><summary>Los calendarios mayas<i>01</i></summary><div><p><b>Tzolk'in</b> · 260 días: 13 números que engranan con 20 días sagrados. Coincide con el embarazo humano y con el ciclo del maíz en la región.</p><p><b>Haab'</b> · 365 días: 18 meses de 20 días más 5 días del Wayeb'.</p><p><b>Rueda calendárica</b> · las dos cuentas vuelven a coincidir cada <b>52 años</b> (18,980 días).</p><p><b>Cuenta Larga</b> · un contador de días desde el 11 de agosto de 3114 a.C. El 21 de diciembre de 2012 completó 13 bak'tunes (5,125 años). No anunciaba el fin del mundo; era como un odómetro que cambia de cifra.</p><p class="note">Algunos investigadores señalan que cinco ciclos de 5,125 años (25,625) se acercan al ciclo de precesión. Es una hipótesis discutida.</p></div></details>
<details class="sec"><summary>Astronomía maya<i>02</i></summary><div><p><b>Venus</b>: calcularon su ciclo de 584 días con error de apenas horas por siglo. <b>Eclipses</b>: el Códice de Dresde predice temporadas de eclipses. <b>El Caracol</b> de Chichén Itzá tiene ventanas alineadas con los extremos de Venus.</p><p>En los equinoccios, la sombra de las escalinatas de la pirámide de <b>Kukulkán</b> forma una serpiente de luz que baja hasta la cabeza de piedra.</p><p>En Orión veían las <b>tres piedras del fogón</b> de la creación (Alnitak, Saiph y Rigel), con la nebulosa como el humo. Las Pléyades eran <b>Tzab</b>, el cascabel de la serpiente.</p></div></details>
<details class="sec"><summary>Los mexicas y los cinco soles<i>03</i></summary><div><p>La <b>Piedra del Sol</b> (3.6 m, 24 toneladas) resume la cosmología mexica. Cuenta que el mundo ha pasado por cuatro eras o soles, cada uno destruido: 4 Jaguar, 4 Viento, 4 Lluvia de fuego y 4 Agua. Vivimos en el <b>Quinto Sol, Nahui Ollin</b> (4 Movimiento).</p><p>Usaban el <b>Tonalpohualli</b> de 260 días y el <b>Xiuhpohualli</b> de 365. Cada 52 años, en el <b>Fuego Nuevo</b>, los sacerdotes subían al cerro Huixachtécatl (Cerro de la Estrella). Si las Pléyades, <b>Tianquiztli</b>, cruzaban el cielo a medianoche, el mundo continuaría otro ciclo.</p><p>El <b>Templo Mayor</b> fue orientado para que en fechas cercanas al equinoccio el Sol saliera entre sus dos templos.</p></div></details>
<details class="sec"><summary>Tabasco en el mapa del cielo<i>04</i></summary><div><p><b>Comalcalco</b>, a una hora de Villahermosa, es la única gran ciudad maya construida con ladrillos cocidos. <b>Palenque</b>, en la frontera con Chiapas, registró en sus inscripciones fechas de miles de años hacia el pasado y el futuro, y su Palacio tiene una torre que se asocia a la observación del cielo.</p></div></details>`;

let camTween=null;const lastFollow=new THREE.Vector3();
function openLim(){controls.minDistance=.01;controls.maxDistance=1e6;}
function applyLim(){if(S.lim){controls.minDistance=S.lim[0];controls.maxDistance=S.lim[1];}}

function flyToObj(get,off,dur=1.8){openLim();camTween={p0:camera.position.clone(),t0:controls.target.clone(),get,off:off.clone(),s:performance.now(),dur:dur*1000};S.follow=get;}
function camStep(){
  if(camTween){const k=ease(clamp((performance.now()-camTween.s)/camTween.dur,0,1));const T=camTween.get?camTween.get():camTween.t1;const P=camTween.get?T.clone().add(camTween.off):camTween.p1;
    controls.target.lerpVectors(camTween.t0,T,k);camera.position.lerpVectors(camTween.p0,P,k);if(k>=1){camTween=null;applyLim();}lastFollow.copy(T);}
  else if(S.follow){const T=S.follow();const dl=T.clone().sub(lastFollow);camera.position.add(dl);controls.target.add(dl);lastFollow.copy(T);}
  controls.update();}

  const pv=poleVec(precAngle(d)),b=O.zPolaris.geometry.attributes.position;b.setXYZ(0,ep.x+pv.x*11,ep.y+pv.y*11,ep.z+pv.z*11);b.setXYZ(1,ep.x+pv.x*30,ep.y+pv.y*30,ep.z+pv.z*30);b.needsUpdate=true;O.zPolaris.computeLineDistances();}
let lastNode=-999;
function upMoon(dt){const d=S.d,E=O.mE;S.spinVis+=spinOmega(0.99727)*dt;const sd=ecl(sunLon(d),0);setEarthSun(E,sd,E.frame.position);orientEarth(E,d,spinExact());
  const m=moonEcl(d);const mp=ecl(m.lon,m.lat,MD*(m.dist/384400));O.mMoon.position.copy(mp);O.mMoon.lookAt(0,0,0);O.mMoon.rotateY(-Math.PI/2);

    O.tB.position.copy(pb.clone().sub(pa));O.tOrbA.scale.setScalar(A.a*k);O.tOrbA.visible=ow;O.tOrbB.visible=false;}

const thumbCache={};
function diskFromEq(src,size,L=[-.55,.45,.7],flat=0){const c=mkCanvas(size,size),x=c.getContext('2d');const sw=src.width,sh=src.height;const sd=src.getContext('2d').getImageData(0,0,sw,sh).data;const im=x.createImageData(size,size),d=im.data;const ln=Math.hypot(...L);
  for(let j=0;j<size;j++)for(let i=0;i<size;i++){const px=(i+.5)/size*2-1,py=(j+.5)/size*2-1,q=px*px+py*py;if(q>1)continue;const pz=Math.sqrt(1-q);const lat=Math.asin(-py),lon=Math.atan2(px,pz);
    const u=Math.floor(mod(lon/(2*Math.PI)+.5,1)*sw),v=Math.floor(clamp(.5-lat/Math.PI,0,.999)*sh);const k=(v*sw+u)*4;const sh2=flat?1:clamp(0.12+1.0*(px*L[0]+(-py)*L[1]+pz*L[2])/ln,0.05,1.1);const a=(j*size+i)*4,edge=clamp((1-Math.sqrt(q))*size*.5,0,1);
    d[a]=sd[k]*sh2;d[a+1]=sd[k+1]*sh2;d[a+2]=sd[k+2]*sh2;d[a+3]=255*edge;}
  x.putImageData(im,0,0);return c;}
function thumb(id){if(thumbCache[id])return thumbCache[id];let c;
  if(id==='sol'){c=mkCanvas(168,168);const x=c.getContext('2d'),g=x.createRadialGradient(70,70,5,84,84,84);g.addColorStop(0,'#fff6d0');g.addColorStop(.6,'#ffb347');g.addColorStop(.95,'#e0601a');g.addColorStop(1,'rgba(224,96,26,0)');x.fillStyle=g;x.fillRect(0,0,168,168);}
  else{const src=id==='tierra'?TX.dayCanvas:id==='luna'?TX.moonCanvas:TX.plc[id];c=diskFromEq(src,168);
    if(id==='saturno'){const x=c.getContext('2d');x.strokeStyle='rgba(230,210,160,.8)';x.lineWidth=6;x.beginPath();x.ellipse(84,84,82,20,-.35,0,Math.PI*2);x.stroke();}}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();

  $('pbody').addEventListener('input',e=>{if(e.target.id==='bday')bdayCalc();if(e.target.id==='kg')weights();if(e.target.id==='nawal')nawalCalc();});
  $('popX').onclick=closePop;$('popA').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)doAct(b.dataset.act);});
  $('astro').addEventListener('click',e=>{ripple(e.clientX,e.clientY);const b=$('bubble');if(b.classList.contains('hide'))tip(TIPS[S.mode]);else b.classList.add('hide');});
  // eclipse
  $('eClose').onclick=closeEclipse;$('ePlay').onclick=()=>{if(EC.t>=1)EC.t=0;EC.play=!EC.play;$('ePlay').textContent=EC.play?'Pausa':'Reproducir';};
  $('eSl').addEventListener('input',e=>{eDrag=true;EC.t=e.target.value/1000;EC.play=false;$('ePlay').textContent='Reproducir';});$('eSl').addEventListener('change',()=>eDrag=false);
  $('eSolar').onclick=()=>openEclipse('solar');$('eLunar').onclick=()=>openEclipse('lunar');
  // maya
  $('mayaHide').onclick=()=>{$('mayaCard').classList.add('off');MG.play=false;};
  $('mPlay').onclick=e=>{MG.play=!MG.play;MG.acc=0;e.currentTarget.classList.toggle('on',MG.play);};
  $('mPrev').onclick=()=>{MG.off--;MG.acc=0;};$('mNext').onclick=()=>{MG.off++;MG.acc=0;};$('mToday').onclick=()=>{MG.off=0;MG.acc=0;};
  // canvas
  const cv=$('gl');let down=null;
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};ripple(e.clientX,e.clientY);closePop();cv.classList.add('dragging');});
  cv.addEventListener('pointerup',e=>{cv.classList.remove('dragging');if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<7&&performance.now()-down.t<500)onPick(pickAt(e.clientX,e.clientY));down=null;});
  let hv=0;cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse')return;if(++hv%3)return;const id=pickAt(e.clientX,e.clientY);hoverId=id;cv.classList.toggle('hover',!!id);});
  controls.addEventListener('start',()=>{if(camTween){camTween=null;applyLim();}});
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();S.playing=!S.playing;syncPlay();}if(e.key==='Escape'){closePop();closeEclipse();}const n=+e.key;if(n>=1&&n<=8)setMode(MODES[n-1].id);});
  addEventListener('resize',onResize);}
function onResize(){const W=innerWidth,H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();if(EC.on)sizeEcl();}

/* ================= bucle ================= */
let lastT=performance.now(),uiAcc=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-lastT)/1000,.1);lastT=now;U.t.value+=dt;
  if(EC.on){eclFrame(dt);return;}
  if(S.playing){if(S.mode==='prec'){S.year+=YSPEEDS[S.ysi][0]*dt;if(S.year>13000)S.year=-13000;}else S.d+=spd()*dt;}
  UPD[S.mode](dt);
  [O.sSun,O.eSun,O.zSun,O.mSun,O.tSun].forEach(s=>{if(s)s.userData.rays.material.rotation+=dt*.04;});
  camStep();G.sky.position.copy(camera.position);G.cons.visible=consVisible();
  updTags();uiAcc+=dt;if(uiAcc>.2){uiAcc=0;tickUI();}
  if(!$('mayaCard').classList.contains('off'))drawGear(dt);
  renderer.render(scene,camera);}

/* ================= arranque ================= */
async function boot(){
  $('bootMark').src=MARK_PNG;$('bootLogo').src=LOGO_PNG;
  const lines=['Presurizando cabina','Enlace con Vórtice VR','Calibrando órbitas','Generando superficie terrestre','Cartografiando constelaciones','Encendiendo el Sol'];let li=0;
  const say=(ok)=>{if(li>=lines.length)return;const d=document.createElement('div');d.innerHTML=`▸ ${lines[li++]} … <span>${ok||'OK'}</span>`;$('bootLines').appendChild(d);};
  const bar=p=>$('bootBar').style.width=(p*100).toFixed(0)+'%';
  if(typeof THREE==='undefined'||!THREE.OrbitControls){$('bootLines').innerHTML='<div>No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la página.</div>';return;}
  try{
    say();bar(.05);await tick();say();buildSeg();buildEras();bar(.1);
    await genEarth(p=>bar(.1+p*.55));say();genMoon();genPlanets();TX.pl.tierra=TX.day;genMisc();bar(.75);await tick();
    const cv=$('gl');renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,0);
    scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,30000);camera.position.set(0,1600,2600);
    controls=new THREE.OrbitControls(camera,cv);controls.enableDamping=true;controls.dampingFactor=.08;controls.rotateSpeed=.55;controls.zoomSpeed=.9;controls.enablePan=false;
    scene.add(new THREE.AmbientLight(0xffffff,.05));
    buildSky();say();bar(.85);buildSolar();buildEarthMode();buildSeasons();buildMoonMode();buildPrec();buildTrazos();say();bar(1);
    wireUI();buildTags();setMode('solar');
    flyTo(new THREE.Vector3(0,230,380),new THREE.Vector3(),4.2);
    requestAnimationFrame(loop);
    setTimeout(()=>$('boot').classList.add('done'),450);
  }catch(err){console.error(err);$('bootLines').innerHTML+=`<div style="color:#ff7a95">Error al iniciar: ${String(err.message||err)}</div>`;}
}
boot();

</script>
