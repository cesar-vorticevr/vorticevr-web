<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Órbita en tu Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--void:#05020b;--panel:rgba(14,7,30,.82);--line:rgba(190,150,255,.25);--line2:rgba(190,150,255,.5);--vortex:#8b3fd6;--lav:#d2b8ff;--ink:#f2ecff;--mute:#aa9ccb;--sun:#ffbe55;
 --fd:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--fb);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#bg{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,#1b0c36 0%,#07030f 60%,#020006 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;pointer-events:none;z-index:5}
#ov>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(5,2,11,.8),rgba(5,2,11,0));pointer-events:none}
.top img{height:20px;filter:drop-shadow(0 0 8px rgba(139,63,214,.7))}
.top b{font-family:var(--fd);font-size:12px;letter-spacing:.2em;text-transform:uppercase;border-left:1px solid var(--line2);padding-left:10px}
#status{position:absolute;left:50%;top:calc(128px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:9px 16px;border-radius:30px;background:rgba(14,7,30,.78);border:1px solid var(--line2);font-size:13px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .4s;pointer-events:none}
#status.off{opacity:0}
#read{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:8px 11px;border-radius:6px;background:rgba(14,7,30,.72);border:1px solid var(--line);font-family:var(--fm);font-size:11px;line-height:1.45;color:#e6dcff;pointer-events:none;text-align:right}
#read em{font-style:normal;color:var(--sun)}
#read[hidden]{display:none}
.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(0deg,rgba(5,2,11,.9),rgba(5,2,11,0))}
.dock[hidden]{display:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.row::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line2);border-radius:22px;background:rgba(20,8,40,.75);font-family:var(--fd);font-size:12px;letter-spacing:.06em;white-space:nowrap;transition:transform .15s,background .2s}
.ch:active{transform:scale(.93)}
.ch.on{background:linear-gradient(160deg,var(--vortex),#4d1a86);border-color:var(--lav);color:#fff;box-shadow:0 0 14px rgba(139,63,214,.6)}
.ch.gold{border-color:var(--sun);color:#ffe2ad}
.ch.ic{width:42px;padding:9px 0;text-align:center;font-size:15px}
#card{position:absolute;left:12px;right:12px;bottom:calc(128px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;background:linear-gradient(170deg,rgba(40,16,74,.95),rgba(12,5,26,.96));border:1px solid var(--lav);border-radius:10px;padding:14px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(139,63,214,.35);transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s cubic-bezier(.2,1.4,.4,1);max-height:46vh;overflow-y:auto}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .k{font-family:var(--fd);font-size:10px;letter-spacing:.24em;color:var(--sun);text-transform:uppercase}
#card h3{font-family:var(--fd);font-size:20px;margin:3px 0 6px;padding-right:28px}
#card p{margin:0 0 8px;font-size:13.5px;line-height:1.5;color:#e7ddfa}
#card p b{color:#fff}
#card .dt{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
#card .dt div{background:rgba(8,3,18,.9);padding:6px 8px;font-size:11px;color:var(--mute)}
#card .dt b{display:block;font-family:var(--fm);font-weight:500;color:var(--ink);font-size:12px}
#card .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--mute)}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;background:radial-gradient(120% 90% at 50% 30%,#1d0b3a,#07030f 65%,#020006);transition:opacity .6s,visibility .6s}
#start.off{opacity:0;visibility:hidden}
#start .orb{width:150px;height:150px;position:relative}
#start .orb i{position:absolute;inset:0;border:1.5px solid var(--line2);border-radius:50%;animation:sp 9s linear infinite}
#start .orb i:nth-child(2){inset:22px;animation-duration:5s;border-color:var(--sun)}
#start .orb b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c4,#ffb13b 45%,#c5520f);box-shadow:0 0 40px #ff9a2e}
#start .orb s{position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9ad0ff,#1f5fb8);box-shadow:0 0 10px #4a88d8}
#start .orb i:nth-child(2) s{width:8px;height:8px;margin-left:-4px;top:-4px;background:#d8d6e8;box-shadow:none}
@keyframes sp{to{transform:rotate(360deg)}}
#start h1{font-family:var(--fd);font-size:clamp(26px,7vw,40px);letter-spacing:.08em;margin:6px 0 0;text-transform:uppercase;text-wrap:balance}
#start p{max-width:420px;margin:0;color:#dcd0f5;line-height:1.55}
#start .big{padding:15px 26px;border-radius:40px;font-family:var(--fd);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;background:linear-gradient(135deg,#ffd27f,#ff9f3a);color:#1a0d00;box-shadow:0 0 30px rgba(255,170,60,.5);min-width:250px}
#start .big.alt{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
#start .big[hidden]{display:none}
#start .nt{font-size:12px;color:var(--mute);max-width:380px}
#start img{height:22px;opacity:.9}
#load{font-family:var(--fm);font-size:11px;color:var(--mute)}
.rip{position:fixed;z-index:9;pointer-events:none;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px solid var(--lav);animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(.1);opacity:1}to{transform:scale(1.3);opacity:0}}
@media (min-width:900px){#card{left:auto;right:16px;bottom:auto;top:90px;width:400px}.dock{padding-bottom:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="gl"></canvas>
<div id="ov">
  <div class="top"><img id="logo" alt="Vórtice VR"><b>Órbita en tu mesa</b></div>

  <div id="read" hidden></div>
  <div id="card"><button class="x" id="cardX" aria-label="Cerrar">×</button><div class="k" id="cK"></div><h3 id="cT"></h3><div id="cB"></div></div>
  <div class="dock" id="dock" hidden>
    <div class="row" id="rowA"></div>
    <div class="row" id="rowB"></div>
  </div>
</div>
<div id="start">

  <div class="orb"><i><s></s></i><i><s></s></i><b></b></div>

  <div id="load">Preparando texturas…</div>
</div>

const SIS={sunR:.045,orb:.26,eR:.026,mD:.062,mR:.0075},TL={eR:.075,mD:.3,mR:.021};
function build(){
  world=new THREE.Group();scene.add(world);
  // plataforma holográfica
  const pad=new THREE.Group();world.add(pad);O.pad=pad;
  pad.add(new THREE.Mesh(new THREE.CircleGeometry(.4,96),new THREE.MeshBasicMaterial({color:0x2a0f55,transparent:true,opacity:.28,depthWrite:false})).rotateX(-Math.PI/2));
  const ring=new THREE.Mesh(new THREE.RingGeometry(.385,.4,128),new THREE.MeshBasicMaterial({color:0xb48cff,transparent:true,opacity:.9,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));ring.rotation.x=-Math.PI/2;pad.add(ring);O.padRing=ring;
  for(let i=0;i<72;i++){const a=i/72*Math.PI*2,l=i%6?.012:.03;pad.add(line([new THREE.Vector3(Math.cos(a)*.37,.001,Math.sin(a)*.37),new THREE.Vector3(Math.cos(a)*(.37-l),.001,Math.sin(a)*(.37-l))],i%6?0x8b3fd6:0xffbe55,.8));}

  const orbHit=new THREE.Mesh(new THREE.TorusGeometry(SIS.orb,.012,6,90),new THREE.MeshBasicMaterial({visible:false}));orbHit.rotation.x=Math.PI/2;orbHit.userData.k='orbita';PICK.push(orbHit);gs.add(orbHit);
  O.e1=makeEarth(SIS.eR);O.e1g=new THREE.Group();O.e1g.add(O.e1.frame);gs.add(O.e1g);hit(SIS.eR*1.8,'tierra',O.e1g);
  O.m1=makeMoon(SIS.mR);gs.add(O.m1);hit(.018,'luna',O.m1);
  O.m1orb=line(circ(SIS.mD,90),0xffffff,.25);gs.add(O.m1orb);
  O.l1=[['Sol',O.sun,SIS.sunR+.03],['Tierra',O.e1g,SIS.eR+.03],['Luna',O.m1,.02]].map(([t,o,dy])=>{const s=label(t);o.add(s);s.position.y=dy;return s;});

  O.polaris=line([new THREE.Vector3(),new THREE.Vector3(0,1,0)],0xffbe55,.9,[.008,.006]);gs.add(O.polaris);

  const gt=new THREE.Group();gt.position.y=H+.03;world.add(gt);O.gt=gt;
  O.e2=makeEarth(TL.eR);gt.add(O.e2.frame);hit(TL.eR*1.15,'tierra',O.e2.frame);

  gt.add(line(circ(TL.mD,128),0xffbe55,.35,[.01,.008]));

  O.ray2=line([new THREE.Vector3(),new THREE.Vector3(1,0,0)],0xffd27f,.35,[.02,.015]);gt.add(O.ray2);
  O.l2=[['Tierra',O.e2.frame,TL.eR+.035],['Luna',O.m2,.045],['Sol',O.sun2,.1]].map(([t,o,dy])=>{const s=label(t,'#f2ecff',.026);o.add(s);s.position.y=dy;return s;});

  // estrellas para el modo 3D
  const n=2500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const z=rnd()*2-1,t=rnd()*6.283,r=Math.sqrt(1-z*z);p.set([r*Math.cos(t)*8,z*8,r*Math.sin(t)*8],i*3);}

let lastNode=-999;
function earthUpdate(E,d,sunDirLocal,moonCenterWorld,moonMesh){
  const p=precAngle(d);E.setOrient(ecl(90-p,90-EPS),ecl(-p,0));
  const exact=!S.playing||SPD[S.si][0]<=.26;if(exact)E.spin.rotation.y=gmst(d)*DEG;else E.spin.rotation.y=S.spin;E.clouds.rotation.y+=.0006;
  world.getWorldQuaternion(qW);const sw=sunDirLocal.clone().applyQuaternion(qW).normalize();E.sunDir.value.copy(sw);
  E.mesh.getWorldPosition(E.mat.uniforms.center.value);E.mat.uniforms.R.value=E.R*world.scale.x;
  const m=moonEcl(d),md=ecl(m.lon,m.lat),dp=md.dot(sunDirLocal),perp=md.clone().sub(sunDirLocal.clone().multiplyScalar(dp));
  E.mat.uniforms.shOn.value=dp>0&&perp.length()<.03?1:0;E.mat.uniforms.shOff.value.copy(perp).applyQuaternion(qW).multiplyScalar(m.dist/6371);
  if(moonMesh){const u=moonMesh.userData.u;u.sunDir.value.copy(sw);moonMesh.getWorldPosition(u.center.value);u.R.value=moonMesh.geometry.parameters.radius*world.scale.x;u.ecOn.value=dp<0&&perp.length()<.03?1:0;u.axOff.value.copy(perp).applyQuaternion(qW).multiplyScalar(m.dist/1737.4);}
  return m;}
function update(dt){
  if(S.playing)S.d+=SPD[S.si][0]*dt;if(S.playing)S.spin+=Math.min(2*Math.PI*SPD[S.si][0]/.997,2.4)*dt;
  const d=S.d,L=sunLon(d);const sis=S.mode!=='tl';O.gs.visible=sis;O.gt.visible=!sis;O.ge.visible=O.polaris.visible=S.mode==='est';
  [O.sun,O.sun2].forEach(s=>s.userData.rays.material.rotation+=dt*.05);
  if(sis){const ep=ecl(L+180,0,SIS.orb);O.e1g.position.copy(ep);const sd=ep.clone().negate().normalize();
    O.e1.lat.visible=S.mode==='est';O.e1.axis.scale.setScalar(S.mode==='est'?1.4:1);
    const mm=moonEcl(d);O.m1.position.copy(ep).add(ecl(mm.lon,mm.lat,SIS.mD));O.m1.lookAt(O.e1g.getWorldPosition(vA));O.m1.rotateY(-Math.PI/2);O.m1orb.position.copy(ep);
    O.m1.updateMatrixWorld();earthUpdate(O.e1,d,sd,null,O.m1);
    const pv=ecl(90-precAngle(d),90-EPS),a=O.polaris.geometry.attributes.position;a.setXYZ(0,ep.x+pv.x*SIS.eR*1.6,ep.y+pv.y*SIS.eR*1.6,ep.z+pv.z*SIS.eR*1.6);a.setXYZ(1,ep.x+pv.x*.13,ep.y+pv.y*.13,ep.z+pv.z*.13);a.needsUpdate=true;O.polaris.computeLineDistances();}
  else{const sd=ecl(L,0);const m=moonEcl(d);const mp=ecl(m.lon,m.lat,TL.mD*m.dist/384400);O.m2.position.copy(mp);O.m2.lookAt(O.gt.localToWorld(vA.set(0,0,0)));O.m2.rotateY(-Math.PI/2);O.m2.updateMatrixWorld();
    earthUpdate(O.e2,d,sd,null,O.m2);O.sun2.position.copy(sd).multiplyScalar(.95);const r=O.ray2.geometry.attributes.position;r.setXYZ(0,sd.x*.88,sd.y*.88,sd.z*.88);r.setXYZ(1,sd.x*.1,sd.y*.1,sd.z*.1);r.needsUpdate=true;O.ray2.computeLineDistances();
    const Om=moonNode(d);if(Math.abs(Om-lastNode)>.2){lastNode=Om;const i=5.145*DEG,pts=[];for(let k=0;k<=160;k++){const u=k/160*Math.PI*2;pts.push(ecl(Om+Math.atan2(Math.cos(i)*Math.sin(u),Math.cos(u))/DEG,Math.asin(Math.sin(i)*Math.sin(u))/DEG,TL.mD));}O.m2orb.geometry.setFromPoints(pts);ecl(Om,0,TL.mD,O.nA.position);ecl(Om+180,0,TL.mD,O.nB.position);O.nLine.geometry.setFromPoints([O.nA.position,O.nB.position]);O.nLine.computeLineDistances();}}
  // animación de aparición
  if(S.anim){const k=clamp((performance.now()-S.anim)/1300,0,1);const b=1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2);world.scale.setScalar(S.scale*Math.max(.001,k<1?b:1));O.padRing.material.opacity=.9*(1-k)+.5;if(k>=1)S.anim=0;}
  else world.scale.setScalar(S.scale);
  world.rotation.y=S.yaw;O.padRing.scale.setScalar(1+.015*Math.sin(U.t.value*3));
}

function status(t,ms){const s=$('status');if(!t){s.classList.add('off');return;}s.textContent=t;s.classList.remove('off');clearTimeout(status.tm);if(ms)status.tm=setTimeout(()=>s.classList.add('off'),ms);}

/* ================= interfaz ================= */
const MODES=[['sis','Sol · Tierra · Luna',3],['tl','Tierra y Luna',2],['est','Estaciones',3]];
function ui(){
  $('rowA').innerHTML=MODES.map(([k,n])=>`<button class="ch${S.mode===k?' on':''}" data-m="${k}">${n}</button>`).join('');
  $('rowB').innerHTML=`<button class="ch ic" data-a="play">${S.playing?'❚❚':'▶'}</button><button class="ch" data-a="spd">${SPD[S.si][1]}</button><button class="ch gold" data-a="esol">Eclipse solar</button><button class="ch gold" data-a="elun">Eclipse lunar</button><button class="ch" data-a="hoy">Hoy</button><button class="ch ic" data-a="menos">−</button><button class="ch ic" data-a="mas">+</button><button class="ch ic" data-a="rot">↻</button>${S.xr?'<button class="ch" data-a="reco">Recolocar</button><button class="ch" data-a="salir">Salir</button>':'<button class="ch" data-a="inicio">Inicio</button>'}`;}
function act(a){
  if(a==='play')S.playing=!S.playing;
  if(a==='spd')S.si=(S.si+1)%SPD.length;
  if(a==='hoy'){S.d=nowD();}
  if(a==='menos')S.scale=Math.max(.3,S.scale/1.25);if(a==='mas')S.scale=Math.min(4,S.scale*1.25);if(a==='rot')S.yaw+=Math.PI/4;
  if(a==='esol'||a==='elun'){const ty=a==='esol'?'solar':'lunar';const r=findEclipse(S.d+1,ty);if(r){S.mode='tl';S.d=r.d-(ty==='solar'?.25:.3);S.si=0;S.playing=true;const c=cdmx(r.d);
    $('cK').textContent='Eclipse '+ty+' · aproximado';$('cT').textContent=`${c.day} de ${MESESL[c.m]} de ${c.y}`;$('cB').innerHTML=ty==='solar'?'<p>La Luna nueva pasa justo entre el Sol y la Tierra, cerca de un nodo. Observa la <b>sombra oscura</b> que recorre la superficie terrestre: ahí se ve el eclipse.</p>':'<p>La Luna llena entra en la sombra de la Tierra. Mira cómo se vuelve <b>rojiza</b>: la atmósfera terrestre desvía hacia ella la luz de todos los amaneceres y atardeceres.</p>';const cd=$('card');cd.classList.remove('on');void cd.offsetWidth;cd.classList.add('on');}}
  if(a==='reco'){S.placed=false;world.visible=false;closeInfo();status('Apunta a una superficie plana y toca para colocar');}
  if(a==='salir'&&session)session.end();
  if(a==='inicio'){$('start').classList.remove('off');$('dock').hidden=true;$('read').hidden=true;closeInfo();}
  ui();}
function wire(){
  $('logo').src=LOGO_PNG;$('logo2').src=LOGO_PNG;
  $('dock').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rip(e.clientX,e.clientY);if(b.dataset.m){S.mode=b.dataset.m;S.si=MODES.find(m=>m[0]===S.mode)[2];closeInfo();ui();}else act(b.dataset.a);});
  $('cardX').onclick=closeInfo;
  $('ov').addEventListener('beforexrselect',e=>{if(e.target.closest&&e.target.closest('button,#card,.dock'))e.preventDefault();});
  // gestos en AR: pellizcar para escalar, arrastrar para girar
  let t0=null;const ov=$('ov');
  ov.addEventListener('touchstart',e=>{if(!S.xr||e.target.closest('button,#card'))return;const t=e.touches;t0={n:t.length,x:t[0].clientX,sc:S.scale,yaw:S.yaw,d:t.length>1?Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY):0,moved:false};},{passive:true});
  ov.addEventListener('touchmove',e=>{if(!t0)return;const t=e.touches;if(t.length>1){if(!t0.d){t0.d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);t0.sc=S.scale;}const dd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);S.scale=clamp(t0.sc*dd/t0.d,.3,4);t0.moved=true;}
    else{const dx=t[0].clientX-t0.x;if(Math.abs(dx)>12){t0.moved=true;S.yaw=t0.yaw+dx*.01;}}if(t0.moved)S.gest=performance.now();},{passive:true});
  ov.addEventListener('touchend',e=>{if(t0&&t0.moved)S.gest=performance.now();if(!e.touches.length)t0=null;},{passive:true});
  // 3D: toque para elegir
  const gl=$('gl');let dn=null;gl.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()};});
  gl.addEventListener('pointerup',e=>{if(!dn||S.xr)return;if(Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<7&&performance.now()-dn.t<500){rip(e.clientX,e.clientY);const k=pickScreen(e.clientX,e.clientY);if(k)openInfo(k);}dn=null;});
  addEventListener('resize',()=>{if(S.xr)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
  $('btn3D').onclick=start3D;$('btnAR').onclick=startAR;}
function rip(x,y){const r=document.createElement('div');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),700);}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function firstKey(hits){for(const h of hits){if(h.object.userData.k){let o=h.object,vis=true;while(o){if(!o.visible){vis=false;break;}o=o.parent;}if(vis)return h.object.userData.k;}}return null;}
function pickScreen(x,y){mv.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(mv,camera);return firstKey(ray.intersectObjects(PICK,false));}

/* ================= modos de visualización ================= */
function start3D(){S.xr=false;$('start').classList.add('off');$('dock').hidden=false;$('read').hidden=false;world.visible=true;S.placed=true;world.position.set(0,0,0);stars.visible=true;controls.enabled=true;
  {const k=innerWidth/innerHeight<1?1.55:1;camera.position.set(0,.55*k,.8*k);}controls.target.set(0,.1,0);S.anim=performance.now();ui();status('Arrastra para girar · toca un astro para ver su información',5000);}
async function startAR(){
  try{session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:$('ov')}});}
  catch(e){$('support').textContent='No se pudo iniciar la realidad aumentada en este dispositivo o navegador. Usa Chrome en un Android compatible con ARCore, o prueba el modo 3D.';return;}
  S.xr=true;controls.enabled=false;stars.visible=false;$('bg').style.display='none';
  renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');await renderer.xr.setSession(session);
  const vs=await session.requestReferenceSpace('viewer');hitSrc=await session.requestHitTestSource({space:vs});
  controller=renderer.xr.getController(0);controller.addEventListener('select',onSelect);scene.add(controller);
  session.addEventListener('end',()=>{S.xr=false;session=null;hitSrc=null;reticle.visible=false;$('bg').style.display='';renderer.xr.enabled=false;$('ov').style.pointerEvents='';start3D();});
  $('ov').style.pointerEvents='auto';$('start').classList.add('off');world.visible=false;S.placed=false;$('dock').hidden=true;$('read').hidden=false;ui();
  status('Mueve el teléfono despacio apuntando a una mesa o al piso');}
const tm=new THREE.Matrix4();
function onSelect(){if(performance.now()-S.gest<350)return;
  if(!S.placed){if(!reticle.visible)return;world.position.setFromMatrixPosition(reticle.matrix);const cp=renderer.xr.getCamera(camera).position;S.yaw=Math.atan2(cp.x-world.position.x,cp.z-world.position.z)-Math.PI/2;
    world.visible=true;S.placed=true;reticle.visible=false;S.anim=performance.now();$('dock').hidden=false;ui();status('¡Listo! Toca un astro para conocerlo · pellizca para escalar',6000);if(navigator.vibrate)try{navigator.vibrate(30);}catch(e){}return;}
  tm.identity().extractRotation(controller.matrixWorld);ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tm);const k=firstKey(ray.intersectObjects(PICK,false));if(k)openInfo(k);}

/* ================= bucle ================= */
let lt=performance.now(),acc=0;
function frame(t,xf){const now=performance.now(),dT=Math.min((now-lt)/1000,.1);lt=now;U.t.value+=dT;
  if(xf&&hitSrc&&!S.placed){const hs=xf.getHitTestResults(hitSrc);if(hs.length){const pose=hs[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);if(!$('status').dataset.f){status('Toca la pantalla para colocar el sistema');$('status').dataset.f=1;}}else reticle.visible=false;O.r2.rotation.y+=dT*2;}
  if(S.placed){update(dT);acc+=dT;if(acc>.25){acc=0;const l=live();$('read').innerHTML=`<em>${l.fecha}</em><br>Luna: ${l.fase}<br>Norte: ${l.N} · Sur: ${l.Sur}`;}}
  if(!S.xr)controls.update();renderer.render(scene,camera);}

/* ================= arranque ================= */
async function init(){
  if(typeof THREE==='undefined'){$('support').textContent='No se pudo cargar el motor 3D. Revisa tu conexión.';return;}
  renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,40);controls=new THREE.OrbitControls(camera,$('gl'));controls.enableDamping=true;controls.minDistance=.15;controls.maxDistance=2.5;controls.enablePan=false;controls.enabled=false;
  camera.position.set(0,.42,.72);
  wire();
  await genEarth(p=>$('load').textContent=`Preparando texturas… ${Math.round(p*100)} %`);genMoon();genMisc();$('load').textContent='';
  build();world.visible=false;renderer.setAnimationLoop(frame);
  let ar=false;try{ar=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'));}catch(e){}
  $('btnAR').hidden=!ar;
  $('support').textContent=ar?'Tu dispositivo es compatible con realidad aumentada.':/iPhone|iPad|iPod/.test(navigator.userAgent)?'Safari en iPhone todavía no permite esta realidad aumentada web. Puedes explorar el sistema en 3D.':'Para realidad aumentada abre este enlace en Chrome desde un Android compatible con ARCore. Aquí puedes explorarlo en 3D.';}
init();

</script>
