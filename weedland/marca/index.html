<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de marca · Weedland</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  html, body { overflow: auto; }
  body { background: radial-gradient(ellipse at 80% 0, #3a1670 0, transparent 50%), var(--fondo); }
  .envoltura { max-width: 1280px; margin: 0 auto; padding: 16px 16px 60px; }
  .barra-sup { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
  .rejilla { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 980px) { .rejilla { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: start; } .lado-replica { position: sticky; top: 12px; order: 2; } }
  .caja { padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--borde); }
  .caja h2 { font-size: 1.2rem; margin-bottom: 12px; }
  label { display: block; font-size: .82rem; font-weight: 800; color: var(--suave); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--borde); color: var(--texto); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=color] { padding: 2px; height: 42px; }
  input[type=range] { padding: 0; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metricas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .met { padding: 12px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--borde); }
  .met b { display: block; font: 700 1.6rem Fredoka, sans-serif; color: var(--c, var(--cian)); }
  .met small { color: var(--suave); font-size: .78rem; font-weight: 700; }
  .prod-fila { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--borde); }
  .prod-fila span { font-size: 1.4rem; }
  .prod-fila div { flex: 1; min-width: 0; }
  .prod-fila small { color: var(--suave); display: block; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 700; color: var(--texto); margin-top: 12px; }
  label.check input { width: auto; }
  .tabla-v { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .88rem; }
  .tabla-v th, .tabla-v td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--borde); }
  .tabla-v th { color: var(--suave); font-weight: 800; font-size: .76rem; }
  .tabla-v td + td, .tabla-v th + th { text-align: right; white-space: nowrap; }

  /* réplica 3D del stand */
  .replica-caja { padding: 0; overflow: hidden; }
  .replica-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
  .replica-cab h2 { margin: 0; font-size: 1.05rem; }
  .replica-vista { position: relative; aspect-ratio: 4 / 3; background: #06030f; }
  @media (max-width: 979px) { .replica-vista { aspect-ratio: auto; height: 46vh; min-height: 260px; } .lado-replica { display: contents; } #c-vistas { order: 3; margin-top: 0 !important; } }
  .replica-vista iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .replica-pie { padding: 8px 14px 12px; color: var(--suave); font-size: .8rem; margin: 0; }

  /* pestañas del editor */
  .ed-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
  .ed-tabs::-webkit-scrollbar { display: none; }
  .ed-tabs button { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--borde); font-weight: 800; font-size: .88rem; white-space: nowrap; }
  .ed-tabs button.activo { background: var(--c, var(--cian)); color: #0b0620; border-color: transparent; }
  .ayuda { color: var(--suave); font-size: .85rem; margin: -4px 0 12px; }

  /* imágenes y videos */
  .slots { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .slot { padding: 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--borde); display: flex; flex-direction: column; gap: 8px; }
  .slot-vista { position: relative; border-radius: 12px; overflow: hidden; background: repeating-conic-gradient(#1b1238 0 25%, #140d2c 0 50%) 0 0 / 18px 18px; display: grid; place-items: center; max-height: 260px; margin: 0 auto; width: 100%; }
  .slot-vista img, .slot-vista video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slot-vista .vacio { color: var(--suave); font-size: .82rem; text-align: center; padding: 10px; }
  .slot b { font-size: .98rem; }
  .slot small { color: var(--suave); font-size: .78rem; line-height: 1.35; }
  .medida { display: inline-block; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--texto); font-weight: 800; font-size: .74rem; }
  .fila-b { display: flex; gap: 6px; flex-wrap: wrap; }
  .orient { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 800; font-size: .74rem; background: var(--c, var(--cian)); color: #0b0620; }
  .segm { display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--borde); }
  .segm button { flex: 1; padding: 8px 6px; font-weight: 800; font-size: .8rem; background: transparent; }
  .segm button.activo { background: var(--c, var(--cian)); color: #0b0620; }
  .promo-ed { padding: 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--borde); margin-top: 10px; }
  .promo-ed .arriba { display: flex; gap: 12px; }
  .promo-ed .pimg { flex: none; width: 96px; height: 96px; border-radius: 12px; background: #140d2c center / cover no-repeat; display: grid; place-items: center; color: var(--suave); font-size: .72rem; text-align: center; border: 1px dashed var(--borde); padding: 4px; }
  .promo-ed .campos { flex: 1; min-width: 0; }
  .promo-ed label { margin-top: 6px; }

  /* recortador de imágenes */
  .rec-fondo { position: fixed; inset: 0; z-index: 80; background: rgba(5,3,15,.82); display: grid; place-items: center; padding: 14px; }
  .rec { width: min(720px, 100%); max-height: calc(100vh - 28px); overflow: auto; padding: 16px; border-radius: 22px; background: var(--panel); border: 1px solid var(--borde); }
  .rec h3 { margin: 0 0 4px; }
  .rec-lienzo { position: relative; margin: 12px auto; background: repeating-conic-gradient(#2a1f4d 0 25%, #1d1540 0 50%) 0 0 / 20px 20px; border-radius: 10px; overflow: hidden; touch-action: none; cursor: grab; }
  .rec-lienzo canvas { display: block; width: 100%; height: 100%; }
  .rec-lienzo .marco { position: absolute; inset: 0; border: 2px dashed rgba(255,255,255,.75); border-radius: 10px; pointer-events: none; }
  .rec-ctl { display: grid; gap: 10px; }
  .rec-ctl .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rec-ctl .fila > span { font-weight: 800; font-size: .82rem; color: var(--suave); min-width: 64px; }
  .colorcito { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--borde); }
  .colorcito.activo { border-color: #fff; box-shadow: 0 0 0 2px var(--c, var(--cian)); }
  .cargando-ed { color: var(--suave); font-size: .85rem; }
</style>
</head>
<body>
<div class="envoltura">
  <div class="barra-sup">
    <div><h1 style="font-size:1.5rem">Panel de marca</h1><p class="suave" style="margin:2px 0 0">Edita tu stand y míralo en vivo. Demo: lo que subes se guarda en este navegador.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="sel" style="width:auto"></select><a class="btn chico" href="../" target="weedland">Ver la estación ↗</a></div>
  </div>
  <div class="rejilla">
    <div class="lado-replica">
      <section class="caja replica-caja">
        <div class="replica-cab"><h2>👀 Tu stand en vivo</h2><button class="btn sec chico" id="recargar-replica">↻ Centrar</button></div>
        <div class="replica-vista"><iframe id="replica" title="Réplica 3D de tu stand"></iframe></div>
        <p class="replica-pie">Arrastra para girarlo. Cada cambio que guardas aparece aquí y en la estación.</p>
      </section>
      <section class="caja" style="margin-top:16px" id="c-vistas"></section>
    </div>
    <div>
      <nav class="ed-tabs" id="ed-tabs">
        <button data-ed="stand">🏛️ Stand</button>
        <button data-ed="imagenes">🖼️ Logo e imágenes</button>
        <button data-ed="videos">🎬 Videos</button>
        <button data-ed="modelo">🧊 Modelo 3D</button>
        <button data-ed="promos">🔥 Promociones</button>
        <button data-ed="catalogo">📦 Catálogo</button>
        <button data-ed="metricas">📊 Métricas</button>
      </nav>
      <section class="caja" id="c-stand" data-panel="stand"></section>
      <section class="caja" id="c-imagenes" data-panel="imagenes" hidden></section>
      <section class="caja" id="c-videos" data-panel="videos" hidden></section>
      <section class="caja" id="c-modelo" data-panel="modelo" hidden></section>
      <section class="caja" id="c-promos" data-panel="promos" hidden></section>
      <section class="caja" id="c-prods" data-panel="catalogo" hidden></section>
      <section class="caja" id="c-met" data-panel="metricas" hidden></section>
    </div>
  </div>
</div>
<script type="module" src="../js/panel.js"></script>
</body>
</html>
