<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de marca · Weedland</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
  html, body { overflow: auto; }
  body { background: radial-gradient(ellipse at 80% 0, #3a1670 0, transparent 50%), var(--fondo); }
  .envoltura { max-width: 1080px; margin: 0 auto; padding: 16px 16px 60px; }
  .barra-sup { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 18px; }
  .rejilla { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .rejilla { grid-template-columns: 1.1fr .9fr; } }
  .caja { padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--borde); }
  .caja h2 { font-size: 1.2rem; margin-bottom: 12px; }
  label { display: block; font-size: .82rem; font-weight: 800; color: var(--suave); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--borde); color: var(--texto); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=color] { padding: 2px; height: 42px; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metricas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .met { padding: 12px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--borde); }
  .met b { display: block; font: 700 1.6rem Fredoka, sans-serif; color: var(--c, var(--cian)); }
  .met small { color: var(--suave); font-size: .78rem; font-weight: 700; }
  .prod-fila { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--borde); }
  .prod-fila span { font-size: 1.4rem; }
  .prod-fila div { flex: 1; min-width: 0; }
  .prod-fila small { color: var(--suave); display: block; }
  .vista { border-radius: 18px; overflow: hidden; aspect-ratio: 16/9; display: grid; align-content: center; padding: 20px; background: linear-gradient(135deg, var(--c2), #06030f); border: 3px solid var(--c); position: relative; }
  .vista .e { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 4.4rem; }
  .vista b { font: 700 1.6rem Fredoka, sans-serif; max-width: 65%; }
  .vista p { color: var(--c); margin: 4px 0 0; font-weight: 700; max-width: 65%; }
</style>
</head>
<body>
<div class="envoltura">
  <div class="barra-sup">
    <div><h1 style="font-size:1.5rem">Panel de marca</h1><p class="suave" style="margin:2px 0 0">Así edita cada marca su stand en Weedland Station (demo: se guarda en este navegador).</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="sel" style="width:auto"></select><a class="btn chico" href="../" target="weedland">Ver la estación ↗</a></div>
  </div>
  <div class="rejilla">
    <div>
      <section class="caja" id="c-stand"></section>
      <section class="caja" style="margin-top:16px" id="c-prods"></section>
    </div>
    <div>
      <section class="caja" id="c-vista"></section>
      <section class="caja" style="margin-top:16px" id="c-met"></section>
    </div>
  </div>
</div>
<script type="module" src="../js/panel.js"></script>
</body>
</html>
