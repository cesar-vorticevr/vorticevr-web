<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crea tu curso · Cursos Vórtice VR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05020b">
<link rel="icon" href="/assets/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/cursos/cursos.css">
<style>
/* the course studio (/cursos/crear/?id=…): guided interview (10 steps, saved at each one), generation of the 5 pieces with
   Claude (server side, streamed), review with hand editing and per-piece regeneration, videos per lesson, and send to review */
main{padding-top:26px}
.top2{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:8px}
.dots{display:flex;gap:6px;margin:18px 0 24px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);background:none;color:var(--mute);font:600 .85rem var(--fd);cursor:pointer}
.dots button.on{border-color:var(--sun);color:var(--sun)}
.dots button.done{background:rgba(139,63,214,.35);color:var(--ink);border-color:var(--vortex)}
.step h2{font-size:clamp(1.4rem,4vw,2rem);margin-bottom:6px}
.step .q{color:var(--mute);margin:0 0 18px;max-width:760px}
.ex{border-left:3px solid var(--sun);background:rgba(255,190,85,.07);padding:10px 14px;border-radius:0 12px 12px 0;font-size:.9rem;color:var(--mute);margin:8px 0 16px;max-width:760px}
.ex b{color:var(--sun);font-weight:600}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;color:var(--mute);margin-bottom:16px;max-width:760px}
label.f input,label.f select,label.f textarea{width:100%}
textarea,input[type=number],input[type=url]{background:var(--surface-solid);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:inherit;font-size:.95rem;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea.big{min-height:220px}
.row2{display:grid;gap:14px;max-width:760px}
@media (min-width:700px){.row2{grid-template-columns:1fr 1fr}}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;max-width:760px}
.sugs{display:grid;gap:8px;margin:-6px 0 16px;max-width:760px}
.sug{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);cursor:pointer;font:inherit}
.sug small{display:block;color:var(--mute)}
.files{list-style:none;padding:0;margin:0 0 12px;max-width:760px}
.files li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.lnk{background:none;border:0;color:var(--bad);cursor:pointer;font:600 .85rem var(--fb)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:760px;margin-bottom:16px}
.th{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;background:none;color:var(--ink);font:600 .85rem var(--fb);text-align:left}
.th.on{border-color:var(--sun)}
.th .sw{height:64px;display:flex;align-items:flex-end;padding:8px;font-size:1rem}
.th span.n{display:block;padding:8px 10px}
.imgs{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.imgs .box{width:220px}
.imgs .pv{width:220px;aspect-ratio:16/9;border-radius:12px;border:1px dashed var(--line2);background:var(--surface) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:.85rem;margin-bottom:8px}
.imgs .pv.logo{aspect-ratio:3/1;background-size:contain}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.sum dt{color:var(--mute);font-size:.88rem}.sum dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.gen{display:grid;gap:10px;max-width:640px}
.pc{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pc .ic{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line2);font-size:.8rem}
.pc.run .ic{border-color:var(--sun);border-top-color:transparent;animation:spin 1s linear infinite}
.pc.ok .ic{background:var(--ok);border-color:var(--ok);color:#05200f}
.pc.bad .ic{border-color:var(--bad);color:var(--bad)}
.pc .t{flex:1}.pc small{display:block;color:var(--mute)}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 18px;position:sticky;top:58px;z-index:6;background:rgba(5,2,11,.92);padding:8px 0}
.ed{display:grid;gap:10px}
.ed details{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface)}
.ed details>summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.ed details>summary::-webkit-details-marker{display:none}
.ed .item{position:relative}
.ed .rm{position:absolute;right:10px;top:10px}
.ed .add{margin:4px 0 12px}
.ed label.f{max-width:none}
.ed .chk{flex-direction:row;align-items:center;gap:10px;color:var(--ink)}
.ed .chk input{width:20px;height:20px;accent-color:#8b3fd6}
.opts{display:grid;gap:8px;margin-bottom:12px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px}
.opt textarea{min-height:44px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.warn{border-color:var(--sun);background:rgba(255,190,85,.08)}
.bad2{border-color:var(--bad);background:rgba(255,122,138,.08)}
.good{border-color:rgba(95,227,161,.5);background:rgba(95,227,161,.07)}
.marks{font-size:.86rem;color:var(--sun)}
.lessons{display:grid;gap:10px}
.lsn{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
@media (min-width:800px){.lsn{grid-template-columns:1.2fr 1.5fr auto;align-items:center}}
.lsn input[type=url]{width:100%}
.kit canvas{width:100%;max-width:270px;border-radius:12px;border:1px solid var(--line)}
.kitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:12px 0 24px}
.copy{position:relative}
.copy pre{white-space:pre-wrap;font:inherit;font-size:.9rem;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
</style>
</head>
<body>
<header class="top"></header>
<main class="wrap" id="main"><div class="empty">Cargando…</div></main>
<footer class="bot"></footer>
<script src="/cursos/cursos.js"></script>
<script src="/cursos/temas.js"></script>
<script>
VC.header("instructor"); VC.footer();
const E = VC.esc, $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
let ID = Q.get("id"), D = null, step = 1, tab = "course", draft = {}, me = {};
const MODS = { recorded: "Grabado", live: "En vivo", mixed: "Mixto" };
const PIECES = { course: "Curso", manual: "Manual", exam: "Examen", landing: "Página de venta", marketing: "Kit de marketing" };
const ORDER = ["course", "manual", "exam", "landing", "marketing"];

// ---------- the interview: one question per step, an example of a good answer, and the field ----------
const STEPS = [
  { t: "¿De qué trata tu curso?", q: "Cuéntalo en una frase. Si ya tiene nombre, escríbelo; si no, te sugerimos algunos.",
    ex: "Enseño a dueños de fondas a calcular el costo real de cada platillo para ponerle un precio que sí deje ganancia.",
    f: [["tema", "En una frase", "area", 300], ["nombre", "Nombre del curso (opcional)", "text", 120, "titulos"], ["categoria", "Categoría", "cat"], ["nivel", "Nivel", "level"]] },
  { t: "¿Para quién es?", q: "Describe a tu alumno típico como si fuera una persona concreta, y el problema que tiene hoy.",
    ex: "Dueña de una fonda de 45 años, vende bien a la hora de la comida pero a fin de mes no le queda dinero y no sabe por qué. Pone precios viendo lo que cobra la competencia.",
    f: [["alumno", "Tu alumno típico", "area", 1500], ["problema", "Qué problema tiene hoy", "area", 1500]] },
  { t: "¿Qué va a poder hacer al terminar?", q: "De 3 a 6 resultados concretos, uno por renglón. Usa verbos que se puedan comprobar: calcular, elaborar, identificar, aplicar. De aquí sale el examen.",
    ex: "Calcular el costo de cada ingrediente por porción\nArmar la receta estándar de un platillo\nFijar un precio de venta con el margen que quiere\nIdentificar los platillos que le hacen perder dinero",
    f: [["resultados", "Resultados (uno por renglón)", "area", 2000]] },
  { t: "Tu temario", q: "Lista los temas como se los explicarías a un amigo, en el orden que te funciona. Si ya tienes material (PDF, Word, PowerPoint o texto), súbelo: se usa como fuente para el contenido técnico.",
    ex: "Primero que entiendan qué es el costo y por qué no es lo mismo que el precio. Luego cómo pesar y anotar cada ingrediente. Después la receta estándar…",
    f: [["temario", "Temario", "big", 6000], ["material", "Tu material (opcional)", "material"]] },
  { t: "Los errores más comunes", q: "¿Qué errores ves en tus alumnos o en la gente que no sabe esto? Son oro: se vuelven advertencias en las lecciones y preguntas del examen.",
    ex: "Calculan el costo con el precio del súper de hace meses. Olvidan la merma (lo que se tira al limpiar). No cuentan el gas ni los desechables.",
    f: [["errores", "Errores comunes", "area", 3000]] },
  { t: "Tus ejemplos y anécdotas", q: "¿Qué ejemplos, casos o historias usas cuando lo explicas? Es lo que hace que el curso suene a ti y no a un libro.",
    ex: "Una clienta vendía su mole a $90 y le costaba $84 hacerlo; cuando lo calculamos juntas lo subió a $120 y no perdió clientes.",
    f: [["ejemplos", "Ejemplos y anécdotas", "area", 4000]] },
  { t: "Modalidad y duración", q: "¿Cómo se toma tu curso y cuánto dura en total?",
    ex: "Grabado, unas 4 horas en total. (En vivo: 3 sesiones de 2 horas, martes y jueves de 7 a 9 pm.)",
    f: [["modalidad", "Modalidad", "mod"], ["horas", "Duración total (horas)", "hours"], ["fechas", "Fechas y horario de la primera edición (en vivo o mixto)", "text", 300, "live"]] },
  { t: "¿Es capacitación laboral?", q: "Si tu curso es para empresas (seguridad, procesos, normatividad, atención a clientes, manejo de equipo), su constancia lleva los datos de la DC-3.",
    ex: "Sí. Clave interna SEG-ALT-01. Requisitos: estar contratado en una empresa del ramo y tener 18 años o más.",
    f: [["laboral", "Sí, es capacitación laboral (constancia con datos DC-3)", "bool"], ["clave", "Clave interna del curso", "text", 40, "lab"], ["requisitos", "Requisitos previos", "area", 1000]] },
  { t: "Precio e identidad", q: "Pon el precio en pesos (IVA incluido; 0 = gratis), la foto de portada, tu logo si tienes, y elige el estilo de tu página de venta.",
    ex: "Precio $1,290. Portada: una foto tuya enseñando o del resultado del curso, horizontal y bien iluminada.",
    f: [["precio", "Precio (MXN)", "price"], ["imagenes", "", "images"], ["tema_visual", "Estilo visual", "theme"]] },
  { t: "Revisa y genera", q: "Así quedó tu entrevista. Si todo está bien, genera tu curso: el curso con sus lecciones y guiones, el manual, el examen, la página de venta y el kit de marketing.", f: [["resumen", "", "summary"]] },
];
const LEVELS = ["Básico", "Intermedio", "Avanzado"];

function field([k, label, type, max, extra]) {
  const v = D.interview[k];
  if (type === "area" || type === "big") return `<label class="f">${label}<textarea name="${k}" maxlength="${max}" class="${type === "big" ? "big" : ""}">${E(v || "")}</textarea></label>`;
  if (type === "text") {
    if (extra === "live" && !["live", "mixed"].includes(D.interview.modalidad)) return "";
    if (extra === "lab" && !D.interview.laboral) return "";
    return `<label class="f">${label}<input type="text" name="${k}" maxlength="${max}" value="${E(v || "")}"></label>${extra === "titulos" ? `<div class="bar2" style="margin-top:-8px"><button class="btn ghost" type="button" id="titulos" style="min-height:38px">✦ Sugerir nombres</button></div><div class="sugs" id="sugs"></div>` : ""}`;
  }
  if (type === "cat") return `<label class="f">${label}<select name="${k}"><option value="">Elige una categoría</option>${D.categories.map(c => `<option ${c === v ? "selected" : ""}>${E(c)}</option>`).join("")}</select></label>`;
  if (type === "level") return `<label class="f">${label}<select name="${k}">${LEVELS.map(c => `<option ${c === (v || "Básico") ? "selected" : ""}>${c}</option>`).join("")}</select></label>`;
  if (type === "mod") return `<label class="f">${label}<select name="${k}" id="modsel">${Object.entries(MODS).map(([id, n]) => `<option value="${id}" ${id === (v || "recorded") ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
  if (type === "hours") return `<label class="f">${label}<input type="number" name="${k}" min="0.5" max="300" step="0.5" value="${E(v ?? "")}"></label>`;
  if (type === "price") return `<label class="f">${label}<input type="number" name="${k}" min="0" max="200000" step="1" value="${E(v ?? "")}" placeholder="Ej. 1290"></label>`;
  if (type === "bool") return `<label class="f" style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" name="${k}" id="labchk" ${v ? "checked" : ""} style="width:20px;height:20px;accent-color:#8b3fd6"><span>${label}</span></label>`;
  if (type === "theme") return `<div class="f" style="margin-bottom:6px">${label}</div><div class="themes">${D.themes.map(id => { const t = VC_TEMAS.list[id]; return `<button type="button" class="th ${id === (v || "vortice") ? "on" : ""}" data-th="${id}"><div class="sw" style="background:${t.c.bg};color:${t.c.accent};font-family:'${t.head}'">Aa<span style="margin-left:auto;width:22px;height:22px;border-radius:50%;background:${t.c.accent2}"></span></div><span class="n">${t.name}</span></button>`; }).join("")}</div>`;
  if (type === "images") return `<div class="imgs"><div class="box"><div class="pv" id="pvport" style="${D.cover ? `background-image:url('${E(D.cover)}')` : ""}">${D.cover ? "" : "Sin portada"}</div><label class="btn ghost" style="min-height:40px">Subir portada<input type="file" id="fport" accept="image/jpeg,image/png,image/webp" hidden></label></div>
    <div class="box"><div class="pv logo" id="pvlogo" style="${D.logo ? `background-image:url('${E(D.logo)}')` : ""}">${D.logo ? "" : "Sin logo (opcional)"}</div><label class="btn ghost" style="min-height:40px">Subir logo<input type="file" id="flogo" accept="image/jpeg,image/png,image/webp" hidden></label></div></div>`;
  if (type === "material") return `<div class="f">${label}</div><ul class="files">${D.material.map(m => `<li><span>${E(m.name)} <span class="mute">(${m.chars.toLocaleString("es-MX")} caracteres)</span></span><button class="lnk" type="button" data-delmat="${m.i}">Quitar</button></li>`).join("")}</ul>
    <div class="bar2" style="margin-top:0"><label class="btn ghost" style="min-height:40px">Subir archivo<input type="file" id="fmat" accept=".pdf,.docx,.pptx,.txt,.md" hidden></label><span class="mute" style="font-size:.85rem">PDF, Word (.docx), PowerPoint (.pptx) o texto.${D.materialChars > 240000 ? " Tu material es largo: lo resumimos por secciones antes de generar." : ""}</span></div>`;
  if (type === "summary") {
    const iv = D.interview, L = D.limits;
    const rows = [["De qué trata", iv.tema], ["Nombre", iv.nombre], ["Categoría", iv.categoria], ["Nivel", iv.nivel], ["Alumno", iv.alumno], ["Problema", iv.problema], ["Resultados", iv.resultados], ["Temario", iv.temario],
      ["Material", D.material.map(m => m.name).join(", ")], ["Errores comunes", iv.errores], ["Ejemplos", iv.ejemplos], ["Modalidad", MODS[iv.modalidad]], ["Duración", iv.horas ? iv.horas + " horas" : ""], ["Fechas", iv.fechas],
      ["Capacitación laboral", iv.laboral ? `Sí${iv.clave ? " · " + iv.clave : ""}` : "No"], ["Requisitos", iv.requisitos], ["Precio", iv.precio === "" || iv.precio == null ? "" : VC.money(iv.precio * 100)], ["Estilo", (VC_TEMAS.list[iv.tema_visual] || {}).name]];
    return `<div class="panel sum"><dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b ? E(b) : '<span class="mute">—</span>'}</dd>`).join("")}</dl></div>
      <p class="mute" style="margin-top:16px">Te quedan <b style="color:var(--ink)">${L.month.left} de ${L.month.max}</b> generaciones completas este mes. Después podrás editar cada pieza a mano y regenerar piezas sueltas (${L.regen.left} de ${L.regen.max} en este curso).</p>
      <p class="mute" style="font-size:.9rem">El generador solo usa lo que tú le das: donde falte un dato deja un marcador <b>[COMPLETAR: …]</b> para que lo llenes. Tarda unos minutos; no cierres esta página.</p>`;
  }
  return "";
}
function renderStep() {
  const S = STEPS[step - 1];
  $("main").innerHTML = `${head()}<div class="dots">${STEPS.map((_, i) => `<button class="${i + 1 === step ? "on" : i + 1 < step ? "done" : ""}" data-go="${i + 1}" aria-label="Paso ${i + 1}">${i + 1}</button>`).join("")}</div>
    <form class="step" id="sf"><div class="kick">Paso ${step} de ${STEPS.length}</div><h2>${S.t}</h2><p class="q">${S.q}</p>
    ${S.ex ? `<div class="ex"><b>Ejemplo:</b> ${E(S.ex).replace(/\n/g, "<br>")}</div>` : ""}
    ${S.f.map(field).join("")}
    <div class="nav"><span>${step > 1 ? `<button class="btn ghost" type="button" id="prev">← Anterior</button>` : ""}</span>
      ${step < STEPS.length ? `<button class="btn sun" type="submit">Siguiente →</button>` : `<button class="btn sun" type="button" id="gen">✦ Generar mi curso</button>`}</div></form>`;
  bindStep();
}
function answersOf() {
  const f = $("sf"), a = {};
  for (const [k, , type] of STEPS[step - 1].f) {
    const el = f.elements[k]; if (!el) continue;
    a[k] = type === "bool" ? el.checked : el.value;
  }
  const th = document.querySelector(".th.on"); if (th) a.tema_visual = th.dataset.th;
  return a;
}
async function saveStep() {
  const a = answersOf(); if (!Object.keys(a).length) return;
  const r = await VC.call(`estudio/${ID}/entrevista`, { method: "PUT", json: { answers: a, step } });
  D.interview = r.interview;
}
function bindStep() {
  bindHead();
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = async () => { try { await saveStep(); } catch (e) {} step = +b.dataset.go; renderStep(); scrollTo({ top: 0 }); });
  $("sf").onsubmit = async e => { e.preventDefault(); try { await saveStep(); step++; renderStep(); scrollTo({ top: 0 }); } catch (err) { VC.toast(err.message); } };
  if ($("prev")) $("prev").onclick = async () => { try { await saveStep(); } catch (e) {} step--; renderStep(); scrollTo({ top: 0 }); };
  if ($("modsel")) $("modsel").onchange = async () => { await saveStep(); renderStep(); };
  if ($("labchk")) $("labchk").onchange = async () => { await saveStep(); renderStep(); };
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { document.querySelectorAll(".th").forEach(x => x.classList.toggle("on", x === b)); });
  if ($("titulos")) $("titulos").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Pensando…";
    try {
      await saveStep();
      const r = await VC.call(`estudio/${ID}/titulos`, { json: {} });
      $("sugs").innerHTML = r.options.map((o, i) => `<button type="button" class="sug" data-sug="${i}"><b>${E(o.title)}</b><small>${E(o.subtitle)}</small></button>`).join("");
      $("sugs").querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { $("sf").elements.nombre.value = r.options[+b.dataset.sug].title; });
    } catch (err) { VC.toast(err.message); }
    e.target.disabled = false; e.target.textContent = "✦ Sugerir nombres";
  };
  for (const [id, kind] of [["fport", "portada"], ["flogo", "logo"]]) if ($(id)) $(id).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const blob = await shrink(f, kind === "portada" ? 1600 : 800); const r = await upload(`estudio/${ID}/${kind}`, blob, f.name); if (kind === "portada") D.cover = r.url; else D.logo = r.url; await saveStep(); renderStep(); }
    catch (err) { VC.toast(err.message); }
  };
  if ($("fmat")) $("fmat").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    VC.toast("Leyendo " + f.name + "…", 2500);
    try { const text = await extractText(f); await VC.call(`estudio/${ID}/material`, { json: { name: f.name, text } }); await saveStep(); await reload(); renderStep(); VC.toast("Material agregado."); }
    catch (err) { VC.toast(err.message, 5000); }
  };
  document.querySelectorAll("[data-delmat]").forEach(b => b.onclick = async () => { await saveStep(); await VC.call(`estudio/${ID}/material/${b.dataset.delmat}`, { method: "DELETE" }); await reload(); renderStep(); });
  if ($("gen")) $("gen").onclick = () => generateAll();
}

// ---------- material: text from PDF (pdf.js), DOCX/PPTX (their XML inside the zip) or plain text, all in the browser ----------
let pdfP;

async function streamPiece(piece, payload, onChars) {
  const s = VC.session();
  const r = await fetch(`/api/cursos/estudio/${ID}/pieza/${piece}`, { method: "POST", headers: { Authorization: "Bearer " + s.token, "Content-Type": "application/json" }, body: JSON.stringify(payload) });

async function generateAll() {

  let start;

  const state = {}, job = start.job;
  const run = async p => {
    state[p] = { st: "run" }; genView(state); bindRetry();
    try {
      const r = await streamPiece(p, { job }, n => { state[p].msg = `Escribiendo… ${Math.round(n / 1000)} mil caracteres`; const el = document.querySelectorAll(".pc")[ORDER.indexOf(p)]; if (el) el.querySelector("small").textContent = state[p].msg; });

function sendTab() {
  const pr = D.problems || [];
  return `<div class="panel ${pr.length ? "warn" : "good"}">${pr.length ? `<b>Antes de enviarlo te falta:</b><ul>${pr.map(p => `<li>${E(p)}</li>`).join("")}</ul>` : "<b>Todo listo.</b> Revisa la vista previa y envíalo: el equipo de Vórtice VR lo revisa y te avisa por correo."}</div>
    <div class="bar2"><button class="btn" id="preview">Ver vista previa</button><button class="btn sun" id="send" ${pr.length ? "disabled" : ""}>Enviar a revisión</button></div>
    <p class="mute" style="font-size:.9rem">La vista previa arma tu curso tal como está ahora: tu página de venta, el reproductor y el manual (solo tú los ves hasta que se publique).</p>
    <div class="bar2"><button class="btn ghost" id="delc" style="border-color:var(--bad);color:var(--bad)">Borrar este borrador</button></div>`;
}
function bindSend() {
  if ($("preview")) $("preview").onclick = async () => {
    try { const r = await VC.call(`estudio/${ID}/vista-previa`, { json: {} }); open(`/cursos/${r.slug}/`, "_blank"); } catch (e) { VC.toast(e.message, 6000); }
  };
  if ($("send")) $("send").onclick = async e => {
    if (!confirm("¿Enviar tu curso a revisión? Mientras lo revisamos no podrás editarlo.")) return;
    e.target.disabled = true;
    try { await VC.call(`estudio/${ID}/enviar`, { json: {} }); await reload(); render(); VC.toast("¡Enviado! Te avisaremos por correo."); } catch (err) { VC.toast(err.message, 8000); e.target.disabled = false; }
  };
  if ($("delc")) $("delc").onclick = async () => {
    if (!confirm("¿Borrar este borrador para siempre?")) return;
    try { await VC.call(`estudio/${ID}`, { method: "DELETE" }); location.href = "/cursos/instructor/"; } catch (e) { VC.toast(e.message); }
  };
}

// ---------- the kit's Instagram images: drawn here in the course's style (1080 × 1350), to download ----------
function kitImages() {
  const k = D.generation.marketing; if (!k) return "";
  return `<div class="panel kit" style="margin-bottom:16px"><div class="kick">Imágenes para Instagram</div><p class="mute" style="font-size:.9rem;margin:6px 0 0">Con el estilo de tu curso, tu foto y tu logo. Si cambias los textos, guarda y se vuelven a dibujar.</p>
    <div class="kitgrid">${k.instagram_posts.map((p, i) => `<div><canvas id="ig${i}" width="1080" height="1350"></canvas><div class="bar2" style="margin:8px 0"><button class="btn ghost" data-dl="${i}" style="min-height:36px">Descargar</button><button class="btn ghost" data-cp="${i}" style="min-height:36px">Copiar texto</button></div></div>`).join("")}</div></div>`;
}
const loadImg = src => new Promise(r => { if (!src) return r(null); const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function drawKit() {
  const k = D.generation.marketing; if (!k) return;
  const t = VC_TEMAS.list[D.interview.tema_visual] || VC_TEMAS.list.vortice, c = t.c;
  if (!document.querySelector(`link[data-font="${t.head}"]`)) { const l = document.createElement("link"); l.rel = "stylesheet"; l.dataset.font = t.head; l.href = `https://fonts.googleapis.com/css2?family=${t.fonts}&display=swap`; document.head.appendChild(l); }
  try { await document.fonts.load(`700 90px "${t.head}"`); } catch (e) {}
  const [avatar, logo, vvr] = await Promise.all([loadImg(me.avatar), loadImg(D.logo), loadImg(t.dark ? "/assets/logo-vorticevr-blanco.png" : "/assets/logo-vorticevr.png")]);
  const wrap = (x, text, max) => { const w = String(text).split(/\s+/), lines = []; let cur = ""; for (const s of w) { const tt = cur ? cur + " " + s : s; if (cur && x.measureText(tt).width > max) { lines.push(cur); cur = s; } else cur = tt; } if (cur) lines.push(cur); return lines; };
  k.instagram_posts.forEach((p, i) => {
    const cv = $("ig" + i); if (!cv) return; const x = cv.getContext("2d"), W = 1080, H = 1350;
    x.fillStyle = c.bg; x.fillRect(0, 0, W, H);
    const gr = x.createRadialGradient(W * .85, H * .1, 10, W * .85, H * .1, 700); gr.addColorStop(0, c.accent2 + "66"); gr.addColorStop(1, c.bg + "00"); x.fillStyle = gr; x.fillRect(0, 0, W, H);
    x.fillStyle = c.accent; x.fillRect(90, 150, 120, 12);
    x.fillStyle = c.ink; let size = 104; x.font = `700 ${size}px "${t.head}", sans-serif`;
    let lines = wrap(x, p.image_headline, W - 180); while (lines.length > 4 && size > 60) { size -= 8; x.font = `700 ${size}px "${t.head}", sans-serif`; lines = wrap(x, p.image_headline, W - 180); }
    let y = 260 + size; lines.forEach(l => { x.fillText(l, 90, y); y += size * 1.12; });
    x.fillStyle = c.mute; x.font = `500 46px "IBM Plex Sans", sans-serif`; y += 20; wrap(x, p.image_subline, W - 180).slice(0, 3).forEach(l => { x.fillText(l, 90, y); y += 60; });
    if (avatar) { x.save(); x.beginPath(); x.arc(160, H - 250, 70, 0, Math.PI * 2); x.clip(); x.drawImage(avatar, 90, H - 320, 140, 140); x.restore(); }
    x.fillStyle = c.ink; x.font = `600 40px "IBM Plex Sans", sans-serif`; x.fillText(me.name || "", avatar ? 260 : 90, H - 262);
    x.fillStyle = c.mute; x.font = `400 32px "IBM Plex Sans", sans-serif`; x.fillText(((D.generation.course || {}).title || "").slice(0, 46), avatar ? 260 : 90, H - 214);
    if (logo) { const h = 90, w = Math.min(300, h * logo.naturalWidth / logo.naturalHeight); x.drawImage(logo, W - 90 - w, 120, w, w * logo.naturalHeight / logo.naturalWidth); }
    x.fillStyle = c.line2; x.fillRect(90, H - 130, W - 180, 2);
    x.fillStyle = c.mute; x.font = `500 28px "IBM Plex Sans", sans-serif`; x.fillText("Avalado por", 90, H - 76);
    if (vvr) { const h = 40, w = h * vvr.naturalWidth / vvr.naturalHeight; x.drawImage(vvr, 260, H - 108, w, h); }
  });
  document.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => $("ig" + b.dataset.dl).toBlob(bl => { const a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = `instagram-${+b.dataset.dl + 1}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png"));
  document.querySelectorAll("[data-cp]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(k.instagram_posts[+b.dataset.cp].caption.replace(/\{\{link\}\}/g, `${location.origin}/cursos/${D.slug}/`)); VC.toast("Texto copiado."); } catch (e) { VC.toast("No se pudo copiar."); } });
}

// ---------- start ----------
async function reload() { D = await VC.call("estudio/" + ID); }
function render() {
  if (D.status === "in_review" || D.status === "published") {
    $("main").innerHTML = `${head()}<div class="panel ${D.status === "published" ? "good" : "warn"}" style="margin-top:14px">${D.status === "published" ? "<b>Tu curso está publicado.</b> Para cambiarlo, escríbenos a hola@vorticevr.mx." : "<b>Tu curso está en revisión.</b> Te avisaremos por correo; mientras tanto no se puede editar."}</div>
      <div class="bar2"><a class="btn sun" href="/cursos/${E(D.slug)}/">Ver la página del curso</a><a class="btn" href="/cursos/aprender/${E(D.slug)}/">Ver el reproductor</a><a class="btn" href="/cursos/manual/${E(D.slug)}/">Ver el manual</a></div>`;
    return;
  }
  if (D.status === "generating" && !D.running.length && !D.generation.course) D.status = "draft";
  if (D.generation.course) renderReview(); else { step = Math.min(STEPS.length, Number(Q.get("paso")) || 1); renderStep(); }
}
(async () => {
  if (!VC.session()) { location.href = VC.loginUrl("cursos/crear"); return; }
  try {
    if (!ID) { const r = await VC.call("estudio", { json: {} }); ID = r.id; history.replaceState(null, "", "?id=" + ID); }
    await reload();
    try { const p = await VC.call("instructor"); me = { name: p.name, avatar: p.profile.avatar }; } catch (e) {}
    render();
  } catch (e) {
    if (e.status === 401) { location.href = VC.loginUrl("cursos/crear"); return; }
    $("main").innerHTML = `<div class="empty"><h2>${E(e.message)}</h2><a class="btn" href="/cursos/instructor/">Ir a mi panel de instructor</a></div>`;
  }
})();
</script>
</body>
