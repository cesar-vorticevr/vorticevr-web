<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin de cursos · Vórtice VR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05020b">
<link rel="icon" href="/assets/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/cursos/cursos.css">
<style>
/* admin of the courses platform (ADMIN_EMAILS): instructors to review, sales and settings. Course review and payouts come later. */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.card{margin-bottom:14px}
.head{display:flex;gap:14px;align-items:flex-start}
.head .img{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--vortex),var(--sun));display:grid;place-items:center;font:700 1.4rem var(--fd)}
.head .img img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin:12px 0}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.docs a{display:inline-block;margin:4px 8px 4px 0}
textarea{width:100%;background:var(--surface-solid);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:inherit;font-size:.92rem;min-height:70px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn.no{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.tw{overflow-x:auto}
form.set{display:grid;gap:14px;max-width:560px}
form.set label{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:.9rem}
form.set input{width:100%}
</style>
</head>
<body>
<header class="top"></header>
<main class="wrap" style="padding-top:30px">
  <div class="kick">Admin de cursos</div><h1 style="font-size:clamp(1.8rem,5vw,2.4rem)">Plataforma de cursos</h1>
  <div class="chips tabs" id="tabs">
    <button class="chip on" data-t="pending">Por revisar</button><button class="chip" data-t="approved">Aprobados</button><button class="chip" data-t="rejected">Rechazados</button>
    <button class="chip" data-t="cursos">Cursos por revisar</button><button class="chip" data-t="publicados">Publicados</button>
    <button class="chip" data-t="ventas">Ventas</button><button class="chip" data-t="cortes">Cortes</button><button class="chip" data-t="constancias">Constancias</button><button class="chip" data-t="consumo">Consumo de IA</button><button class="chip" data-t="ajustes">Ajustes</button>
  </div>
  <div id="view"><div class="empty">Cargando…</div></div>
</main>
<footer class="bot"></footer>
<script src="/cursos/cursos.js"></script>
<script>
VC.header(); VC.footer();
const E = VC.esc, $ = id => document.getElementById(id);
let tab = "pending";
const date = t => t ? new Date(t).toLocaleString("es-MX", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
async function show(t) {
  tab = t; document.querySelectorAll("#tabs .chip").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("view").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    if (t === "ventas") return ventas(await VC.call("admin/ventas"));
    if (t === "ajustes") return ajustes(await VC.call("admin/ajustes"));
    if (t === "cursos" || t === "publicados") return cursos(await VC.call("admin/cursos?estado=" + (t === "cursos" ? "in_review" : "published")));
    if (t === "consumo") return consumo(await VC.call("admin/consumo"));
    if (t === "cortes") return cortes(await VC.call("admin/cortes"));
    if (t === "constancias") return constancias(await VC.call("admin/constancias?q=" + encodeURIComponent(cq)));
    instructores(await VC.call("admin/instructores?estado=" + t));
  } catch (e) {
    if (e.status === 401) { location.href = VC.loginUrl("cursos/admin"); return; }
    $("view").innerHTML = `<div class="empty">${E(e.message)}</div>`;
  }
}
function instructores(r) {
  document.querySelectorAll("#tabs .chip").forEach(b => { const n = r.counts[b.dataset.t]; if (n !== undefined) b.textContent = b.textContent.replace(/ \(\d+\)$/, "") + ` (${n})`; });
  $("view").innerHTML = r.list.length ? r.list.map(i => `<div class="panel card"><div class="head"><div class="img">${i.avatar ? `<img src="${E(i.avatar)}" alt="">` : E((i.name || "?")[0])}</div>
      <div><h3 style="margin:0">${E(i.name)}</h3><div class="mute">${E(i.headline)}</div><div class="mono" style="margin-top:4px">${E(i.email)}</div></div></div>
      <dl class="kv"><dt>Ciudad</dt><dd>${E(i.city)}, ${E(i.state)}</dd><dt>Teléfono</dt><dd>${E(i.phone || "—")}</dd><dt>RFC</dt><dd>${E(i.rfc || "—")}</dd><dt>Factura</dt><dd>${i.can_invoice ? "Sí puede facturar" : "No puede facturar"}</dd>
        <dt>Enviado</dt><dd>${date(i.submitted_at)}</dd><dt>Inducción</dt><dd>${i.onboarding_passed ? "Aprobada" : "Pendiente"}</dd><dt>Premier</dt><dd>${E({ inactive: "Sin Premier", active: "Activo", past_due: "Pago pendiente", canceled: "Cancelado" }[i.premier.status] || i.premier.status)}${i.premier.until ? " · hasta " + date(i.premier.until) : ""}</dd>
        ${i.review_note ? `<dt>Nota</dt><dd>${E(i.review_note)}</dd>` : ""}</dl>
      <details><summary class="mono" style="cursor:pointer">Biografía</summary><div class="md" style="margin-top:8px">${VC.md(i.bio)}</div></details>
      <div class="docs" style="margin-top:10px">${i.documents.map(d => `<a class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.82rem" href="#" data-doc="${E(d.id)}">${E(d.label)} · ${E(d.name)}</a>`).join("") || `<span class="mute">Sin documentos</span>`}</div>
      ${tab !== "approved" ? `<textarea id="n-${i.id}" placeholder="Nota para el instructor (obligatoria si rechazas: le llega por correo)"></textarea>
        <div class="acts"><button class="btn sun" data-a="approve" data-u="${i.id}">Aprobar</button>${tab === "pending" ? `<button class="btn no" data-a="reject" data-u="${i.id}">Pedir cambios</button>` : ""}</div>` : ""}</div>`).join("")
    : `<div class="empty">No hay instructores en esta lista.</div>`;
  document.querySelectorAll("[data-doc]").forEach(a => a.onclick = async e => {   // documents are private: fetched with the session, opened as a blob
    e.preventDefault();
    const s = VC.session(), w = window.open("", "_blank");
    const r = await fetch("/api/cursos/admin/documento/" + a.dataset.doc, { headers: { Authorization: "Bearer " + s.token } });
    if (!r.ok) { w && w.close(); VC.toast("No se pudo abrir."); return; }
    const u = URL.createObjectURL(await r.blob()); if (w) w.location = u; else location.href = u;
  });
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const note = $("n-" + b.dataset.u).value;
    if (b.dataset.a === "reject" && note.trim().length < 5) { VC.toast("Escribe qué necesita corregir."); return; }
    b.disabled = true;
    try { await VC.call("admin/instructores/" + b.dataset.u, { json: { action: b.dataset.a, note } }); VC.toast(b.dataset.a === "approve" ? "Aprobado. Le avisamos por correo." : "Le pedimos los cambios por correo."); show(tab); }
    catch (e) { VC.toast(e.message); b.disabled = false; }
  });
}
const mx = c => "$" + ((c || 0) / 100).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " MXN";
function ventas(r) {
  const paid = r.list.filter(o => o.status === "paid"), sum = k => paid.reduce((a, o) => a + (o[k] || 0), 0);
  $("view").innerHTML = `<div class="panel" style="margin-bottom:16px">Pagadas: <b>${paid.length}</b> · Cobrado <b>${mx(sum("amount"))}</b> · Comisión <b>${mx(sum("commission"))}</b> · A instructores <b>${mx(sum("net"))}</b></div>
    <div class="panel tw">${r.list.length ? `<table><thead><tr><th>Fecha</th><th>Curso</th><th>Alumno</th><th>Monto</th><th>Comisión</th><th>Instructor</th><th>Estado</th><th>Factura</th></tr></thead><tbody>
      ${r.list.map(o => `<tr><td>${date(o.paid_at)}</td><td>${E(o.course)}</td><td>${E(o.student)}<div class="mute">${E(o.email)}</div></td><td>${mx(o.amount)}</td><td>${mx(o.commission)}</td><td>${mx(o.net)}</td>
        <td>${o.status === "paid" ? "Pagada" : o.status === "refunded" ? "Reembolsada" : E(o.status)}${o.mode === "test" ? ' <span class="tag gold">prueba</span>' : ""}</td>
        <td>${o.cfdi ? `${E(o.cfdi.rfc)}<div class="mute">${E(o.cfdi.name)} · CP ${E(o.cfdi.cp)} · Rég. ${E(o.cfdi.regimen)} · Uso ${E(o.cfdi.uso)}</div>` : "—"}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Todavía no hay ventas.</div>`}</div>`;
}
// courses sent to review: open the sales page, the player and the manual as the students will see them (admins see drafts), then publish or ask for changes
function cursos(r) {
  const review = tab === "cursos";
  $("view").innerHTML = r.list.length ? r.list.map(c => `<div class="panel card"><div class="head">${c.cover_url ? `<img src="${E(c.cover_url)}" alt="" style="width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px">` : ""}
      <div><h3 style="margin:0">${E(c.title)}</h3><div class="mute">${E(c.subtitle || "")}</div><div class="mono" style="margin-top:4px">${E(c.name || "")} · ${E(c.email || "")}</div></div></div>
      <dl class="kv"><dt>Precio</dt><dd>${mx(c.price_mxn)}</dd><dt>Modalidad</dt><dd>${E(VC.MODALITY[c.modality] || "")} · ${VC.hours(c.duration_hours)}</dd><dt>Contenido</dt><dd>${c.lessons} lecciones · ${c.questions} preguntas${c.certificate_kind === "dc3" ? " · constancia DC-3" : ""}</dd>
        <dt>${review ? "Enviado" : "Publicado"}</dt><dd>${date(review ? c.submitted_at : c.published_at)}</dd></dl>
      <div class="docs"><a class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.82rem" href="/cursos/${E(c.slug)}/" target="_blank">Página de venta</a><a class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.82rem" href="/cursos/aprender/${E(c.slug)}/" target="_blank">Reproductor y examen</a><a class="btn ghost" style="min-height:36px;padding:6px 12px;font-size:.82rem" href="/cursos/manual/${E(c.slug)}/" target="_blank">Manual</a></div>
      ${review ? `<textarea id="cn-${E(c.id)}" placeholder="Comentarios para el instructor (obligatorios si pides cambios: le llegan por correo)"></textarea>
        <div class="acts"><button class="btn sun" data-ca="approve" data-c="${E(c.id)}">Aprobar y publicar</button><button class="btn no" data-ca="reject" data-c="${E(c.id)}">Pedir cambios</button></div>` : ""}</div>`).join("")
    : `<div class="empty">${review ? "No hay cursos por revisar." : "Todavía no hay cursos de instructores publicados."}</div>`;
  document.querySelectorAll("[data-ca]").forEach(b => b.onclick = async () => {
    const note = $("cn-" + b.dataset.c).value;
    if (b.dataset.ca === "reject" && note.trim().length < 5) { VC.toast("Escribe qué necesita corregir."); return; }
    b.disabled = true;
    try { await VC.call("admin/cursos/" + b.dataset.c, { json: { action: b.dataset.ca, note } }); VC.toast(b.dataset.ca === "approve" ? "Publicado. Le avisamos por correo." : "Le pedimos los cambios por correo."); show(tab); }
    catch (e) { VC.toast(e.message); b.disabled = false; }
  });
}
// half-month payouts: generate the cut, see each instructor's invoice and account, mark as paid with the transfer reference
const PST = { pending: "Esperando factura", invoice_received: "Factura recibida", paid: "Pagado" };
function cortes(r) {
  $("view").innerHTML = `<div class="panel" style="margin-bottom:16px"><b>Por cortar:</b> ${r.pending.n} ventas · ${mx(r.pending.net)} para instructores
      <div class="acts"><button class="btn sun" id="cut">Generar corte de la ${E(r.next.label)}</button></div>
      <p class="mute" style="font-size:.86rem;margin:8px 0 0">Junta las ventas pagadas de esa quincena que no estén en otro corte, por instructor, y descuenta los reembolsos de ventas ya pagadas. A cada instructor le llega un correo para subir su factura.</p></div>
    <div class="panel tw">${r.list.length ? `<table><thead><tr><th>Periodo</th><th>Instructor</th><th>Ventas</th><th>Comisión</th><th>Ajustes</th><th>A pagar</th><th>Cuenta</th><th>Estado</th><th></th></tr></thead><tbody>
      ${r.list.map(p => `<tr><td>${E(p.label)}</td><td>${E(p.name)}<div class="mute">${E(p.email)}</div></td><td>${p.orders} · ${mx(p.gross)}</td><td>${mx(p.commission)}</td><td>${p.adjust ? mx(p.adjust) : "—"}</td><td><b>${mx(p.net)}</b></td>
        <td>${p.account ? `${E(p.account.banco || "")}<div class="mono" style="color:var(--ink)">${E(p.account.clabe || "")}</div><div class="mute">${E(p.account.titular || "")}</div>` : '<span style="color:var(--bad)">Sin cuenta</span>'}</td>
        <td>${PST[p.status] || E(p.status)}${p.status === "paid" ? `<div class="mute">${date(p.paid_at)} · ${E(p.reference || "")}</div>` : ""}</td>
        <td>${p.invoice ? `<a href="#" data-inv="${E(p.id)}">Factura</a>` : ""}${p.status !== "paid" && p.net > 0 ? `<div><input type="text" id="ref-${E(p.id)}" placeholder="Referencia" style="min-height:36px;margin-top:6px;width:150px"><button class="btn" data-pay="${E(p.id)}" style="min-height:36px;margin-top:6px">Marcar pagado</button></div>` : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Todavía no hay cortes.</div>`}</div>`;
  $("cut").onclick = async e => {
    if (!confirm(`¿Generar el corte de la ${r.next.label}?`)) return;
    e.target.disabled = true;
    try { const x = await VC.call("admin/cortes", { json: { period: r.next.period } }); VC.toast(x.made.length ? `Corte listo: ${x.made.length} instructores.` : "No había ventas nuevas en ese periodo."); show("cortes"); }
    catch (err) { VC.toast(err.message, 6000); e.target.disabled = false; }
  };
  document.querySelectorAll("[data-inv]").forEach(a => a.onclick = async ev => {
    ev.preventDefault(); const s = VC.session(), w = window.open("", "_blank");
    const res = await fetch(`/api/cursos/admin/cortes/${a.dataset.inv}/factura`, { headers: { Authorization: "Bearer " + s.token } });
    if (!res.ok) { w && w.close(); VC.toast("No se pudo abrir."); return; }
    const u = URL.createObjectURL(await res.blob()); if (w) w.location = u; else location.href = u;
  });
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const ref = $("ref-" + b.dataset.pay).value.trim(); if (ref.length < 3) { VC.toast("Escribe la referencia de la transferencia."); return; }
    b.disabled = true;
    try { await VC.call(`admin/cortes/${b.dataset.pay}/pagado`, { json: { reference: ref } }); VC.toast("Marcado como pagado; le avisamos por correo."); show("cortes"); }
    catch (e) { VC.toast(e.message); b.disabled = false; }
  });
}
// certificates: find by folio, name or course; revoke with a reason (shown on the public verification page)
let cq = "";
function constancias(r) {
  $("view").innerHTML = `<div class="panel" style="margin-bottom:14px"><input type="search" id="cq" value="${E(cq)}" placeholder="Folio, alumno o curso" style="width:100%;max-width:420px"></div>
    <div class="panel tw">${r.list.length ? `<table><thead><tr><th>Folio</th><th>Alumno</th><th>Curso</th><th>Emitida</th><th>Estado</th><th></th></tr></thead><tbody>
      ${r.list.map(k => `<tr><td class="mono" style="color:var(--ink)">${E(k.folio)}</td><td>${E(k.student_name)}</td><td>${E(k.course_title)}</td><td>${date(k.issued_at)}</td>
        <td>${k.revoked ? `<span style="color:var(--bad)">Revocada</span><div class="mute">${E(k.revoked_reason || "")}</div>` : "Válida"}</td>
        <td><a href="/cursos/verificar/${E(k.verify_token)}/" target="_blank">Ver</a>${k.revoked ? "" : ` · <a href="#" data-rv="${E(k.folio)}" style="color:var(--bad)">Revocar</a>`}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">No hay constancias${cq ? " con esa búsqueda" : ""}.</div>`}</div>`;
  if (cq) { $("cq").focus(); $("cq").setSelectionRange(cq.length, cq.length); }
  let t; $("cq").oninput = e => { clearTimeout(t); t = setTimeout(() => { cq = e.target.value.trim(); show("constancias"); }, 400); };
  document.querySelectorAll("[data-rv]").forEach(a => a.onclick = async ev => {
    ev.preventDefault();
    const reason = prompt(`Motivo para revocar ${a.dataset.rv} (se muestra en la verificación pública):`, ""); if (reason === null) return;
    try { await VC.call(`admin/constancias/${a.dataset.rv}/revocar`, { json: { reason } }); VC.toast("Constancia revocada."); show("constancias"); } catch (e) { VC.toast(e.message); }
  });
}
function consumo(r) {
  const total = r.list.reduce((a, x) => a + (x.cost || 0), 0);
  $("view").innerHTML = `<div class="panel" style="margin-bottom:16px">Costo estimado total: <b>${mx(Math.round(total * 100))}</b> <span class="mute">(precio de la API × tipo de cambio de Ajustes)</span></div>
    <div class="panel tw">${r.list.length ? `<table><thead><tr><th>Mes</th><th>Instructor</th><th>Generaciones completas</th><th>Llamadas</th><th>Tokens (entrada / salida)</th><th>Costo</th></tr></thead><tbody>
      ${r.list.map(x => `<tr><td>${E(x.month)}</td><td>${E(x.name || "—")}<div class="mute">${E(x.email || "")}</div></td><td>${x.fulls}</td><td>${x.calls}</td><td>${(x.tin || 0).toLocaleString("es-MX")} / ${(x.tout || 0).toLocaleString("es-MX")}</td><td>${mx(Math.round((x.cost || 0) * 100))}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Todavía no hay generaciones.</div>`}</div>`;
}
function ajustes(s) {
  $("view").innerHTML = `<div class="panel"><form class="set" id="set">
    <label>Precio de Premier al mes (MXN, IVA incluido)<input type="number" name="premier_price_mxn" min="10" step="1" value="${E(s.premier_price_mxn)}" placeholder="Sin precio: Premier no se puede contratar"></label>
    <label>Comisión de la plataforma (%)<input type="number" name="commission_pct" min="0" max="90" value="${E(s.commission_pct)}"></label>
    <label>Número de registro ACE ante la STPS (sale en las constancias)<input type="text" name="ace_registration_number" maxlength="40" value="${E(s.ace_registration_number)}"></label>
    <label>Quién firma las constancias por Vórtice VR<input type="text" name="certificate_signer_name" maxlength="80" value="${E(s.certificate_signer_name)}" placeholder="Vacío: Vórtice VR"></label>
    <label>Su cargo<input type="text" name="certificate_signer_title" maxlength="80" value="${E(s.certificate_signer_title)}" placeholder="Ej. Dirección académica"></label>
    <p class="mute" style="margin:0;font-size:.88rem">Stripe: ${s.stripe ? (s.stripe === "live" ? "claves reales" : "claves de prueba (solo los admins pueden pagar)") : "sin configurar"}. Si cambias el precio de Premier, las suscripciones nuevas usan el precio nuevo.</p>
    <div><button class="btn sun" type="submit">Guardar ajustes</button></div></form></div>`;
  $("set").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    try { ajustes(await VC.call("admin/ajustes", { json: Object.fromEntries(new FormData(f)) })); VC.toast("Ajustes guardados."); } catch (err) { VC.toast(err.message); }
  };
}
$("tabs").onclick = e => { const b = e.target.closest(".chip"); if (b) show(b.dataset.t); };
if (!VC.session()) location.href = VC.loginUrl("cursos/admin"); else show("pending");
</script>
</body>
</html>
