<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verificar constancia · Vórtice VR</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05020b">
<link rel="icon" href="/assets/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/cursos/cursos.css">
<style>
/* public verification of a certificate (/cursos/verificar/<token>/, the QR of every certificate); no sign-in */
.state{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;margin-bottom:20px;font:600 1.1rem var(--fd)}
.state.ok{background:rgba(95,227,161,.12);border:1px solid rgba(95,227,161,.5);color:var(--ok)}
.state.bad{background:rgba(255,122,138,.12);border:1px solid rgba(255,122,138,.5);color:var(--bad)}
.state .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;flex:none}
.state.ok .ic{background:var(--ok);color:#05200f}.state.bad .ic{background:var(--bad);color:#300}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
dt{color:var(--mute);font-size:.9rem}
dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.pdf{width:100%;aspect-ratio:11/8.5;border:1px solid var(--line);border-radius:14px;margin-top:20px;background:#fff}
@media (max-width:700px){.pdf{display:none}}
</style>
</head>
<body>
<header class="top"></header>
<main class="wrap" style="padding-top:36px;max-width:900px" id="main"><div class="empty">Verificando…</div></main>
<footer class="bot"></footer>
<script src="/cursos/cursos.js"></script>
<script>
VC.header(); VC.footer();
const E = VC.esc, tk = VC.slugFromPath();
const MOD = { recorded: "En línea (grabado)", live: "En vivo", mixed: "Mixto" };
VC.call("verificar/" + encodeURIComponent(tk)).then(k => {
  const date = new Date(k.issued_at).toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric", timeZone: "America/Mexico_City" });
  document.getElementById("main").innerHTML = `<div class="kick">Verificación de constancia</div><h1 style="font-size:clamp(1.7rem,5vw,2.4rem)">${E(k.course)}</h1>
    <div class="state ${k.revoked ? "bad" : "ok"}"><span class="ic">${k.revoked ? "✕" : "✓"}</span><span>${k.revoked ? "Constancia revocada" : "Constancia válida, emitida por Vórtice VR"}</span></div>
    ${k.revoked && k.revoked_reason ? `<p class="mute">Motivo: ${E(k.revoked_reason)}</p>` : ""}
    <div class="panel"><dl><dt>Alumno</dt><dd>${E(k.student)}</dd><dt>Curso</dt><dd>${E(k.course)}</dd><dt>Folio</dt><dd class="mono" style="color:var(--ink);font-size:.95rem">${E(k.folio)}</dd>
      <dt>Emitida</dt><dd>${E(date)}</dd>${k.period ? `<dt>Periodo</dt><dd>${E(k.period)}</dd>` : ""}${k.hours ? `<dt>Duración</dt><dd>${VC.hours(k.hours)}</dd>` : ""}<dt>Modalidad</dt><dd>${E(MOD[k.modality] || k.modality)}</dd>
      <dt>Instructor</dt><dd>${E(k.instructor)}</dd><dt>Tipo</dt><dd>${k.kind === "dc3" ? "Constancia de capacitación (datos DC-3)" : "Constancia Vórtice VR"}</dd></dl>
      <div style="margin-top:18px"><a class="btn sun" href="${E(k.pdf)}" target="_blank" rel="noopener">Abrir el PDF</a></div></div>
    <iframe class="pdf" src="${E(k.pdf)}#view=FitH" title="Constancia en PDF"></iframe>`;
}).catch(e => {
  document.getElementById("main").innerHTML = `<div class="state bad"><span class="ic">✕</span><span>${E(e.message)}</span></div><p class="mute">Revisa que la liga o el código QR estén completos. Si crees que es un error, escríbenos a hola@vorticevr.mx.</p>`;
});
</script>
</body>
</html>
